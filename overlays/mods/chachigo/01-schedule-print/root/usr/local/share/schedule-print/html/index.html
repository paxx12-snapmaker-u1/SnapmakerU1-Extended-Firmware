<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule Print</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: Roboto, 'Segoe UI', Arial, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 1.5rem 1rem;
    }
    .card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 560px;
      margin: 0 auto;
    }
    h1 { font-size: 1.25rem; margin: 0 0 1.5rem; color: #fff; }
    label {
      display: block;
      font-size: 0.78rem;
      color: #9e9e9e;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field { margin-bottom: 1rem; }
    select, input[type="date"], input[type="time"] {
      width: 100%;
      padding: 0.55rem 0.75rem;
      background: #2c2c2c;
      color: #e0e0e0;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus, input:focus { border-color: #1976d2; }
    .row { display: flex; gap: 0.75rem; }
    .row .field { flex: 1; margin-bottom: 0; }

    /* Upload */
    .upload-row { display: flex; align-items: center; gap: 0.6rem; }
    #btn-upload-trigger {
      padding: 0.45rem 0.9rem;
      background: #2c2c2c;
      color: #ccc;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #btn-upload-trigger:hover { background: #383838; }
    #upload-status { font-size: 0.82rem; }

    /* File grid */
    #file-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      height: 420px;
      overflow-y: auto;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 0.4rem;
    }
    #file-grid.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80px;
      color: #666;
      font-size: 0.85rem;
    }
    .file-card {
      background: #2a2a2a;
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.1s, background 0.1s;
      height: 150px;
    }
    .file-card:hover { background: #333; border-color: #444; }
    .file-card.selected { border-color: #1976d2; background: #1a2733; }
    .file-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }
    .thumb-placeholder {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #3a3a3a;
    }
    .file-name {
      font-size: 0.68rem;
      padding: 0.25rem 0.35rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #bbb;
    }

    /* Filament mapping */
    .mapping-table { display: flex; flex-direction: column; gap: 0.4rem; }
    .mapping-row { display: flex; align-items: center; gap: 0.5rem; }
    .mapping-swatch {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0;
    }
    .mapping-label { font-size: 0.85rem; color: #aaa; width: 2.2rem; flex-shrink: 0; }
    .mapping-select { flex: 1; padding: 0.35rem 0.5rem; font-size: 0.85rem; }

    /* Calibrations */
    .calib-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .calib-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.9rem;
      color: #ddd;
      text-transform: none;
      letter-spacing: 0;
      margin-bottom: 0;
      cursor: pointer;
    }
    .calib-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: #1976d2;
      cursor: pointer;
      flex: none;
    }
    .calib-row .hint { color: #777; font-size: 0.78rem; }

    /* Buttons */
    button {
      width: 100%;
      padding: 0.65rem;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #btn-schedule { background: #1976d2; color: #fff; margin-top: 1rem; }
    #btn-schedule:hover { background: #1565c0; }
    #btn-schedule:disabled { background: #37474f; color: #78909c; cursor: default; }
    .error { color: #ef9a9a; font-size: 0.85rem; margin-top: 0.5rem; display: none; }

    /* Status card */
    .status-card {
      background: #1a2733;
      border: 1px solid #1976d2;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1.25rem;
      display: none;
    }
    .status-card h2 {
      font-size: 0.78rem;
      color: #64b5f6;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 0.75rem;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.9rem;
      margin: 0.3rem 0;
      gap: 0.5rem;
    }
    .status-row .lbl { color: #9e9e9e; white-space: nowrap; }
    .status-row .val { color: #fff; font-weight: 500; text-align: right; word-break: break-all; }
    #btn-cancel { background: #b71c1c; color: #fff; margin-top: 0.75rem; }
    #btn-cancel:hover { background: #c62828; }
  </style>
</head>
<body>
<div class="card">
  <h1>Schedule Print</h1>

  <div class="field">
    <label for="sel-tz">Timezone</label>
    <select id="sel-tz"></select>
  </div>

  <div class="field">
    <label>Upload GCode</label>
    <div class="upload-row">
      <input type="file" id="inp-upload" accept=".gcode,.gco,.g,.ufp" style="display:none">
      <button type="button" id="btn-upload-trigger"
              onclick="document.getElementById('inp-upload').click()">Choose file…</button>
      <span id="upload-status"></span>
    </div>
  </div>

  <div class="field">
    <label>File <span id="file-count"
      style="font-size:0.75rem;font-weight:normal;text-transform:none;letter-spacing:0;color:#666"></span></label>
    <div id="file-grid" class="empty">Loading files…</div>
  </div>

  <div class="field" id="mapping-field" style="display:none">
    <label>Filament mapping</label>
    <div class="mapping-table" id="mapping-table"></div>
  </div>

  <div class="field">
    <label>Calibrations &amp; timelapse</label>
    <div class="calib-list">
      <label class="calib-row">
        <input type="checkbox" id="chk-bed-level">
        <span>Auto bed leveling</span>
      </label>
      <label class="calib-row">
        <input type="checkbox" id="chk-flow-calibrate">
        <span>Flow (extrusion) calibration</span>
      </label>
      <label class="calib-row">
        <input type="checkbox" id="chk-timelapse">
        <span>Timelapse</span>
      </label>
    </div>
  </div>

  <div class="row" style="margin-bottom:1rem">
    <div class="field">
      <label for="inp-date">Date</label>
      <input type="date" id="inp-date">
    </div>
    <div class="field">
      <label for="inp-time">Time</label>
      <input type="time" id="inp-time">
    </div>
  </div>

  <div class="error" id="err"></div>
  <button id="btn-schedule">Schedule Print</button>

  <div class="status-card" id="status-box">
    <h2>Scheduled</h2>
    <div class="status-row"><span class="lbl">File</span><span class="val" id="st-file">—</span></div>
    <div class="status-row"><span class="lbl">Starts at</span><span class="val" id="st-time">—</span></div>
    <div class="status-row"><span class="lbl">In</span><span class="val" id="st-cd">—</span></div>
    <div class="status-row" id="st-map-row" style="display:none">
      <span class="lbl">Mapping</span><span class="val" id="st-map">—</span>
    </div>
    <div class="status-row" id="st-prefs-row" style="display:none">
      <span class="lbl">Options</span><span class="val" id="st-prefs">—</span>
    </div>
    <button id="btn-cancel">Cancel scheduled print</button>
  </div>
</div>

<script>
const API = '/server/schedule_print';
const FILES_API = '/server/files/list?root=gcodes';
const FILAMENT_API = '/printer/objects/query?print_task_config';

const LANES = ['E0', 'E1', 'E2', 'E3'];

const TIMEZONES = [
  { g: 'UTC', z: ['UTC'] },
  { g: 'Americas', z: [
    'America/New_York','America/Chicago','America/Denver','America/Los_Angeles',
    'America/Anchorage','America/Halifax','America/Toronto','America/Vancouver',
    'America/Sao_Paulo','America/Argentina/Buenos_Aires','America/Mexico_City',
    'America/Bogota','America/Lima','America/Santiago',
  ]},
  { g: 'Europe', z: [
    'Europe/London','Europe/Lisbon','Europe/Paris','Europe/Berlin','Europe/Madrid',
    'Europe/Rome','Europe/Amsterdam','Europe/Brussels','Europe/Vienna','Europe/Zurich',
    'Europe/Stockholm','Europe/Oslo','Europe/Copenhagen','Europe/Warsaw','Europe/Prague',
    'Europe/Budapest','Europe/Bucharest','Europe/Helsinki','Europe/Kyiv',
    'Europe/Moscow','Europe/Istanbul','Europe/Athens',
  ]},
  { g: 'Africa', z: [
    'Africa/Cairo','Africa/Johannesburg','Africa/Lagos','Africa/Nairobi','Africa/Casablanca',
  ]},
  { g: 'Asia', z: [
    'Asia/Dubai','Asia/Riyadh','Asia/Tehran','Asia/Karachi','Asia/Kolkata',
    'Asia/Dhaka','Asia/Colombo','Asia/Kathmandu','Asia/Bangkok','Asia/Jakarta',
    'Asia/Singapore','Asia/Hong_Kong','Asia/Shanghai','Asia/Tokyo','Asia/Seoul',
    'Asia/Taipei','Asia/Manila','Asia/Kuala_Lumpur',
  ]},
  { g: 'Pacific', z: [
    'Australia/Perth','Australia/Adelaide','Australia/Brisbane',
    'Australia/Sydney','Australia/Melbourne','Pacific/Auckland',
    'Pacific/Fiji','Pacific/Honolulu','Pacific/Guam',
  ]},
];

const GCODE_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
  fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
  <polyline points="14 2 14 8 20 8"/>
  <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
  <polyline points="10 9 9 9 8 9"/></svg>`;

// ── Timezone ──────────────────────────────────────────────────────────
function tzOffset(tz, dateStr) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, timeZoneName: 'longOffset',
  }).formatToParts(new Date(dateStr + 'T12:00:00Z'));
  const name = parts.find(p => p.type === 'timeZoneName')?.value ?? 'GMT';
  return name === 'GMT' ? '+00:00' : name.slice(3);
}
function toIso(dateStr, timeStr, tz) {
  return `${dateStr}T${timeStr}:00${tzOffset(tz, dateStr)}`;
}
function formatTs(ts, tz) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, dateStyle: 'medium', timeStyle: 'short',
  }).format(new Date(ts * 1000));
}
function formatCountdown(secs) {
  if (secs <= 0) return 'imminent';
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
  return h > 0 ? `${h}h ${m}m` : m > 0 ? `${m}m ${s}s` : `${s}s`;
}
function todayInTz(tz) {
  return new Intl.DateTimeFormat('sv-SE', { timeZone: tz }).format(new Date());
}
function showError(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

// ── Filament mapping ──────────────────────────────────────────────────
let loadedPtc = null;
let selectedExtruderMap = [];

function rgbaToCSS(hex) {
  if (!hex || hex.length < 6) return null;
  return `#${hex.slice(0, 6)}`;
}

function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function colorDist(h1, h2) {
  const [r1, g1, b1] = hexToRgb(h1), [r2, g2, b2] = hexToRgb(h2);
  return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}

function findBestSlot(hexColor) {
  if (!loadedPtc) return null;
  let best = null, bestDist = Infinity;
  LANES.forEach((_, i) => {
    if (!loadedPtc.filament_exist?.[i]) return;
    const slotHex = rgbaToCSS(loadedPtc.filament_color_rgba?.[i] ?? '');
    if (!slotHex) return;
    const d = colorDist(hexColor, slotHex);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

function buildExtruderMapping(gcodeColors) {
  const field = document.getElementById('mapping-field');
  const table = document.getElementById('mapping-table');
  table.innerHTML = '';
  selectedExtruderMap = [];
  if (!gcodeColors.length) { field.style.display = 'none'; return; }
  gcodeColors.forEach((color, ti) => {
    const bestSlot = findBestSlot(color);
    selectedExtruderMap[ti] = bestSlot;
    const row = document.createElement('div');
    row.className = 'mapping-row';
    const swatch = document.createElement('span');
    swatch.className = 'mapping-swatch';
    swatch.style.background = color;
    swatch.title = color;
    const lbl = document.createElement('span');
    lbl.className = 'mapping-label';
    lbl.textContent = `T${ti}`;
    const slotColors = LANES.map((_, i) => rgbaToCSS(loadedPtc?.filament_color_rgba?.[i] ?? ''));
    const sel = document.createElement('select');
    sel.className = 'mapping-select';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '— (no remap)';
    sel.appendChild(noneOpt);
    LANES.forEach((lane, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const slotColor = slotColors[i];
      const slotType = loadedPtc?.filament_type?.[i] ?? '';
      const exist = loadedPtc?.filament_exist?.[i];
      opt.textContent = `${lane}${slotType ? ` — ${slotType}` : ''}${!exist ? ' (empty)' : ''}`;
      if (slotColor) { opt.style.backgroundColor = slotColor; opt.style.color = '#111'; }
      opt.disabled = !exist;
      sel.appendChild(opt);
    });
    const slotPreview = document.createElement('span');
    slotPreview.className = 'mapping-swatch';
    const updatePreview = () => {
      const idx = sel.value !== '' ? parseInt(sel.value) : null;
      slotPreview.style.background = idx !== null && slotColors[idx] ? slotColors[idx] : '#444';
    };
    sel.value = bestSlot !== null ? bestSlot : '';
    updatePreview();
    sel.addEventListener('change', () => {
      selectedExtruderMap[ti] = sel.value !== '' ? parseInt(sel.value) : null;
      updatePreview();
    });
    row.append(swatch, lbl, slotPreview, sel);
    table.appendChild(row);
  });
  field.style.display = 'block';
}

async function onFileSelected(filename) {
  document.getElementById('mapping-field').style.display = 'none';
  document.getElementById('mapping-table').innerHTML = '';
  selectedExtruderMap = [];
  try {
    const data = await fetch(`/server/files/metadata?filename=${encodeURIComponent(filename)}`).then(r => r.json());
    const colorStr = data.result?.filament_colour;
    if (!colorStr) return;
    buildExtruderMapping(colorStr.split(';').filter(Boolean));
  } catch {}
}

async function loadFilamentSlots() {
  try {
    const data = await fetch(FILAMENT_API).then(r => r.json());
    loadedPtc = data.result?.status?.print_task_config;
  } catch {}
}

// ── Thumbnail lazy-loader ─────────────────────────────────────────────
let thumbObserver = null;

function loadThumb(card) {
  const ph = card.querySelector('.thumb-placeholder');
  if (!ph) return;
  fetch(`/server/files/metadata?filename=${encodeURIComponent(card.dataset.filename)}`)
    .then(r => r.json())
    .then(data => {
      const thumbs = data.result?.thumbnails;
      if (!thumbs?.length) return;
      const best = thumbs.sort((a, b) => b.width - a.width)[0];
      const img = document.createElement('img');
      img.className = 'file-thumb';
      img.alt = '';
      img.src = `/server/files/gcodes/${best.relative_path}`;
      ph.replaceWith(img);
    })
    .catch(() => {});
}

function initThumbObserver() {
  if (!('IntersectionObserver' in window)) return;
  thumbObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      thumbObserver.unobserve(e.target);
      loadThumb(e.target);
    });
  }, { rootMargin: '150px' });
}

// ── File grid ─────────────────────────────────────────────────────────
let selectedFile = '';

function selectFile(filename, card) {
  selectedFile = filename;
  document.querySelectorAll('.file-card.selected').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  showError('');
  onFileSelected(filename);
}

async function loadFiles(autoSelect) {
  const grid = document.getElementById('file-grid');
  try {
    const data = await fetch(FILES_API).then(r => r.json());
    const files = (data.result ?? []).sort((a, b) => (b.modified ?? 0) - (a.modified ?? 0));
    grid.innerHTML = '';
    grid.classList.toggle('empty', !files.length);
    if (!files.length) { grid.textContent = 'No GCode files found'; return; }
    document.getElementById('file-count').textContent =
      `— ${files.length} file${files.length !== 1 ? 's' : ''}`;
    const target = autoSelect ?? selectedFile;
    files.forEach(f => {
      const card = document.createElement('div');
      card.className = 'file-card';
      card.dataset.filename = f.path;
      const ph = document.createElement('div');
      ph.className = 'thumb-placeholder';
      ph.innerHTML = GCODE_ICON;
      const nameEl = document.createElement('div');
      nameEl.className = 'file-name';
      nameEl.title = f.path;
      nameEl.textContent = f.path.split('/').pop();
      card.append(ph, nameEl);
      card.addEventListener('click', () => selectFile(f.path, card));
      grid.appendChild(card);
      if (thumbObserver) thumbObserver.observe(card); else loadThumb(card);
      if (f.path === target) selectFile(f.path, card);
    });
  } catch {
    grid.classList.add('empty');
    grid.textContent = 'Failed to load files';
  }
}

// ── Upload ────────────────────────────────────────────────────────────
async function handleUpload(file) {
  const status = document.getElementById('upload-status');
  status.style.color = '#9e9e9e';
  status.textContent = `Uploading ${file.name}…`;
  const form = new FormData();
  form.append('root', 'gcodes');
  form.append('file', file, file.name);
  try {
    const r = await fetch('/server/files/upload', { method: 'POST', body: form });
    const data = await r.json();
    if (!r.ok) {
      status.style.color = '#ef9a9a';
      status.textContent = data.error?.message ?? 'Upload failed';
      return;
    }
    const uploaded = data.result?.item?.path ?? file.name;
    status.style.color = '#81c784';
    status.textContent = `✓ ${file.name}`;
    await loadFiles(uploaded);
    setTimeout(() => { status.textContent = ''; }, 4000);
  } catch (e) {
    status.style.color = '#ef9a9a';
    status.textContent = 'Error: ' + e.message;
  }
}

// ── Status / Schedule / Cancel ────────────────────────────────────────
async function loadStatus() {
  try {
    const data = await fetch(API).then(r => r.json());
    const sc = data.result?.scheduled;
    const box = document.getElementById('status-box');
    if (!sc || sc.seconds_remaining <= 0) { box.style.display = 'none'; return; }
    const tz = document.getElementById('sel-tz').value;
    document.getElementById('st-file').textContent = sc.filename;
    document.getElementById('st-time').textContent = formatTs(sc.target_ts, tz);
    document.getElementById('st-cd').textContent = formatCountdown(sc.seconds_remaining);
    const mapRow = document.getElementById('st-map-row');
    const map = sc.extruder_map;
    if (map && map.some(v => v !== null)) {
      document.getElementById('st-map').textContent =
        map.map((v, i) => v !== null ? `T${i}→E${v}` : null).filter(Boolean).join(', ');
      mapRow.style.display = 'flex';
    } else {
      mapRow.style.display = 'none';
    }
    const prefsRow = document.getElementById('st-prefs-row');
    const prefs = sc.preferences;
    const enabled = [];
    if (prefs) {
      if (prefs.bed_level) enabled.push('Bed leveling');
      if (prefs.flow_calibrate) enabled.push('Flow calibration');
      if (prefs.timelapse) enabled.push('Timelapse');
    }
    if (enabled.length) {
      document.getElementById('st-prefs').textContent = enabled.join(', ');
      prefsRow.style.display = 'flex';
    } else {
      prefsRow.style.display = 'none';
    }
    box.style.display = 'block';
  } catch {}
}

async function schedule() {
  showError('');
  const tz = document.getElementById('sel-tz').value;
  const dateStr = document.getElementById('inp-date').value;
  const timeStr = document.getElementById('inp-time').value;
  if (!selectedFile) { showError('Please select a file.'); return; }
  if (!dateStr || !timeStr) { showError('Please enter a date and time.'); return; }
  const btn = document.getElementById('btn-schedule');
  btn.disabled = true;
  try {
    const body = {
      filename: selectedFile,
      time: toIso(dateStr, timeStr, tz),
      timezone: tz,
      bed_level: document.getElementById('chk-bed-level').checked,
      flow_calibrate: document.getElementById('chk-flow-calibrate').checked,
      timelapse: document.getElementById('chk-timelapse').checked,
    };
    if (selectedExtruderMap.some(v => v !== null))
      body.extruder_map = selectedExtruderMap.map(v => v ?? null);
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) { showError(data.error?.message ?? `Error ${r.status}`); return; }
    await loadStatus();
  } catch (e) {
    showError('Network error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function cancel() {
  await fetch(API, { method: 'DELETE' });
  document.getElementById('status-box').style.display = 'none';
}

// ── Init ──────────────────────────────────────────────────────────────
function initTzSelect() {
  const sel = document.getElementById('sel-tz');
  TIMEZONES.forEach(({ g, z }) => {
    const grp = document.createElement('optgroup');
    grp.label = g;
    z.forEach(tz => {
      const opt = document.createElement('option');
      opt.value = tz;
      opt.textContent = tz.replace(/_/g, ' ');
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
  const saved = localStorage.getItem('sp_tz')
    ?? Intl.DateTimeFormat().resolvedOptions().timeZone ?? 'UTC';
  sel.value = Array.from(sel.options).some(o => o.value === saved) ? saved : 'UTC';
  sel.addEventListener('change', () => {
    localStorage.setItem('sp_tz', sel.value);
    updateDateDefault();
  });
}

function updateDateDefault() {
  const tz = document.getElementById('sel-tz').value;
  const today = todayInTz(tz);
  const inp = document.getElementById('inp-date');
  inp.min = today;
  if (!inp.value || inp.value < today) inp.value = today;
}

document.addEventListener('DOMContentLoaded', () => {
  initThumbObserver();
  initTzSelect();
  updateDateDefault();
  loadFiles();
  loadFilamentSlots();
  loadStatus();
  document.getElementById('inp-upload').addEventListener('change', e => {
    if (e.target.files[0]) handleUpload(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('btn-schedule').addEventListener('click', schedule);
  document.getElementById('btn-cancel').addEventListener('click', cancel);
  setInterval(loadStatus, 10000);
});
</script>
</body>
</html>
