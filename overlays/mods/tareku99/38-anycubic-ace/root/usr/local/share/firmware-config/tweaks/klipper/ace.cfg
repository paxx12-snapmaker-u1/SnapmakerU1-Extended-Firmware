# MultiACE-derived ACE Pro / ACE 2 Pro integration.
# The runtime modules are shipped as switchable *_ace.py companions and are
# activated by Firmware Config only when this include is enabled.
[save_variables]
filename: /home/lava/printer_data/config/extended/multiace/ace_vars.cfg
[ace]
ace_device_count: 1
enable_ace_v2: true
v2_order: first
enable_web: false
web_dir: /usr/local/share/firmware-config/tweaks/klipper/multiace

# ACE 2 (V2) only: accept extra USB vid:pid IDs as a V2 device. Use this
# if you drive an ACE 2 through a generic USB-RS485 adapter instead of the
# genuine Anycubic CH343 cable (1a86:55d3) - e.g. a CH340 adapter
# (1a86:7523). Comma/space separated; a bare pid assumes vendor 1a86.
# Leave unset to keep the strict 55d3-only match (recommended unless you
# actually use such an adapter - the CH340 chip is generic and would also
# match unrelated serial devices).
#v2_extra_usb_ids: 1a86:7523


# The firmware overlay does not install the optional MultiACE web/update
# service. Keep runtime update checks disabled in this self-contained build.
update_url_base:


language: en
display_index_base: 1

# Who owns a head's filament identity on the printer display when the
# firmware has flagged it "official" - a genuine RFID spool, or paxx's
# SpoolLink stamping one to lock the display against hand edits.
#   multiace  (default) force our identity through on ACE-driven heads.
#             On an ACE head our identity is the truth about what prints,
#             and SpoolLink cannot bind an ACE slot at all - it keys on the
#             RFID card UID, which no ACE slot reports. Forcing clears the
#             official flag and, when the filament actually changed, the
#             Spoolman binding with it.
#   spoollink keep out of such heads. The binding survives, at the price of
#             a display that can show the wrong material after a swap.
# Feeder and manual heads are never touched, whichever you pick.
#identity_priority: multiace

state_debug: false
usb_debug: false
fa_debug: false
# Diagnostic samplers (default off). airlog = eddy-coil flow sampler (mid-
# print air-print baseline); stall_watchdog = reactor-stall watchdog + V1
# write timing. For debugging only - leave off for normal use.
#airlog: false
#stall_watchdog: false

# Pickup-Cleaning (experimental, default off). A short nozzle wipe at the
# discard position after a bare-T tool pickup that has NO cleaning move (a
# same-colour return; real swaps + bg arrivals already wipe). Toggle live via
# the web UI ("Pickup-Cleaning") or ACE_SET_PICKUP_CLEANING ENABLE=0|1
# (persisted as ace__pickup_cleaning, which overrides this default). The
# preflight stamps ACE_PICKUP_CLEAN only when the setting is on.
#pickup_cleaning: false

baud: 115200
feed_speed: 80
# Hot seat press after the load heat: pushes the sensor-stopped tip the
# last mm into the extruder gear nip (slow, busy-retried; V2 self-stops
# at resistance, V1 = bounded by this length). 0 = off.
seat_overshoot_length: 20
retract_speed: 80

retract_length: 1950
load_length: 2100

# Per-head manual / TPU bypass (boot default; toggle live via the web UI
# "Manual" checkbox or ACE_SET_HEAD_MANUAL HEAD=n ENABLE=0|1, persisted).
# When True for a head: no ACE feed, retract, feed-assist or RFID push for
# it - load it by hand. The head sensor stays active (runout protection).
#head_manual_0: False
#head_manual_1: False
#head_manual_2: False
#head_manual_3: False

# head-mode ACE head (boot default for the head that is ACE-driven in
# 'head' mode; 0-based, default 3). 'head' mode = exactly ONE head is
# ACE-driven (fixed to ACE 0, e.g. via a 4->1 combiner so that ACE's slots
# all feed one head); every OTHER head uses its stock side feeder. The
# operating mode itself is switched live with SET_ACE_MODE MODE=multi|head
# [HEAD=n] / the web Config tab (persisted as ace__mode + ace__ace_head).
# In 'head' mode the web/UI shows only the one coupled ACE even if more are
# physically attached. 0 ACE heads = normal, 1 = head, all = multi.
#ace_head: 3

load_retry: 3
load_retry_retract: 50

extrusion_retry: 7
extrusion_retry_retract: 30
extrusion_retry_retract_a: 50
wiggle_scheme: EAEAEAE

unload_retry: 3

max_dryer_temperature: 70
dryer_temp: 55
dryer_duration: 240

swap_default_temp: 250
swap_retract_length: 900
swap_purge_length: 0
swap_anti_ooze_retract: 10

v2_feed_check_check_length: 254
v2_feed_check_error_length: 254

# V2 print-time feed assist. Defaults are fine; uncomment to tune.
#   v2_print_assist_mode: constant   # constant (default) | tracked
#     constant = ACE assists gently, filament follows the extruder's pull
#       (no per-tick speed tracking) - avoids bowden flex when the extruder
#       out-pulls the ACE. Only flips to unwind on a sustained reverse.
#     tracked  = legacy: quantize live extruder velocity, push speed each tick.
#   v2_constant_assist_speed: 0      # 0 = ACE firmware default; >0 = pin once
#   v2_assist_confirm_time: 0.5      # s a reverse must hold before unwind flip


[gcode_macro SET_ACE_MODE]
description: Switch mode. Usage: SET_ACE_MODE MODE=normal|multi|head [HEAD=n]
gcode:
  {% set mode = params.MODE|default('')|lower %}
  {% if mode not in ['normal', 'single', 'multi', 'head'] %}
    {action_respond_info("ERROR: Use SET_ACE_MODE MODE=normal, multi, or head [HEAD=n]")}
  {% else %}
    {% set current = printer.save_variables.variables.get('ace__mode', 'normal') %}
    {% if current == mode %}
      {action_respond_info("Already in %s mode (re-syncing)..." % mode|upper)}
    {% else %}
      {action_respond_info("Switching to %s mode..." % mode|upper)}
    {% endif %}
    {% set needs_unload = (current in ['single', 'multi', 'head'] and mode == 'normal') or (current == 'normal' and mode in ['single', 'multi', 'head']) %}
    {% if needs_unload %}
      {% set e0 = printer['filament_motion_sensor e0_filament'].filament_detected %}
      {% set e1 = printer['filament_motion_sensor e1_filament'].filament_detected %}
      {% set e2 = printer['filament_motion_sensor e2_filament'].filament_detected %}
      {% set e3 = printer['filament_motion_sensor e3_filament'].filament_detected %}
      {% set loaded = [] %}
      {% if e0 %}{% set _ = loaded.append('E0') %}{% endif %}
      {% if e1 %}{% set _ = loaded.append('E1') %}{% endif %}
      {% if e2 %}{% set _ = loaded.append('E2') %}{% endif %}
      {% if e3 %}{% set _ = loaded.append('E3') %}{% endif %}
      {% if loaded|length > 0 %}
        {action_respond_info("Cannot switch mode! Filament still loaded in: %s" % loaded|join(', '))}
        {action_respond_info("Please unload all toolheads first, then try again.")}
      {% else %}
        ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
      {% endif %}
    {% else %}
      ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
    {% endif %}
  {% endif %}
[gcode_macro ACEA__Switch_0]
description: Switch to ACE 0
gcode:
  ACE_SWITCH TARGET=0
[gcode_macro ACEA__Switch_1]
description: Switch to ACE 1
gcode:
  ACE_SWITCH TARGET=1
[gcode_macro ACEA__Switch_2]
description: Switch to ACE 2
gcode:
  ACE_SWITCH TARGET=2
[gcode_macro ACEA__Switch_3]
description: Switch to ACE 3
gcode:
  ACE_SWITCH TARGET=3
[gcode_macro ACEB__Load_0]
