[save_variables]
filename: /home/lava/printer_data/config/ace_vars.cfg

[ace]
# The device model, serial path, protocol, and baud are detected automatically.
# This file is installed only when the mod is enabled in Firmware Config.

# Keep ACE slot metadata separate from the existing U1 RFID path for this first
# hardware test. RFID integration can be added after the load path is verified.
rfid_source: existing

# ACE load speed in mm/s.
load_speed: 80

# ACE 2 Pro feed-check window.
feed_check_len: 254
feed_check_error_len: 254

# Distance from each ACE slot through the tube path to the U1 runout sensor.
# Tune these values for the installed tube routing before loading filament.
load_length_slot1: 2100
load_length_slot2: 2100
load_length_slot3: 2100
load_length_slot4: 2100

# Maximum dryer temperature exposed by the test macros.
max_dryer_temperature: 55

[gcode_macro ACE_STATUS]
description: Show ACE connection and gate status
gcode:
  ACE_GET_STATUS

[gcode_macro ACE_REFRESH_CONNECTION]
description: Redetect and reconnect the ACE
gcode:
  ACE_REFRESH

[gcode_macro ACE_TEMP]
description: Show ACE temperature and dryer status
gcode:
  ACE_GET_TEMP

[gcode_macro ACE_DRYING_ON]
description: Start the ACE dryer at the configured test temperature
gcode:
  ACE_START_DRYING TEMP=55 DURATION=240

[gcode_macro ACE_DRYING_OFF]
description: Stop the ACE dryer
gcode:
  ACE_STOP_DRYING
