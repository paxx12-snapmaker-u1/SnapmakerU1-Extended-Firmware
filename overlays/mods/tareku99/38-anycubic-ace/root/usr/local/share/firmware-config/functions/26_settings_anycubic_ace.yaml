settings:
  snapmaker_components:
    items:
      anycubic_ace_experimental:
        label: Anycubic ACE (experimental)
        description: Optional single-ACE Pro / ACE 2 Pro loading and status test.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/ace.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: Enabled
            confirm: |
              Enable the experimental Anycubic ACE load path?

              The ACE model is detected over USB. Review and tune
              ace.cfg before loading filament. Klipper will restart.
            cmd:
              - bash
              - -ec
              - |
                ace_found=0
                for ace_device in /dev/serial/by-id/usb-ANYCUBIC* /dev/serial/by-id/usb-1a86_USB_Single_Serial_* /dev/serial/by-id/usb-1a86_USB_Serial*; do
                  if [ -e "$ace_device" ]; then
                    ace_found=1
                    break
                  fi
                done
                if [ "$ace_found" -ne 1 ]; then
                  echo "ERROR: No compatible ACE serial device detected."
                  exit 1
                fi
                mkdir -p /oem/printer_data/config/extended/klipper
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/ace.cfg /oem/printer_data/config/extended/klipper/ace.cfg
                echo "Experimental ACE enabled. Review ace.cfg and restart Klipper..."
                /etc/init.d/S60klipper restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -ec
              - |
                rm -f /oem/printer_data/config/extended/klipper/ace.cfg
                echo "Experimental ACE disabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
        default: disabled

actions:
  troubleshooting:
    items:
      anycubic-ace-experimental-refresh:
        label: Refresh experimental ACE connection
        description: Redetect and reconnect the ACE without changing configuration.
        cmd:
          - bash
          - -ec
          - |
            curl -sS -X POST -H 'Content-Type: application/json' -d '{"script":"ACE_REFRESH"}' http://127.0.0.1:7125/printer/gcode/script
        message: "Refreshing experimental ACE connection..."
