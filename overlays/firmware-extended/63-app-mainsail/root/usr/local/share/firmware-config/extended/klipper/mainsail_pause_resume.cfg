[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: _PAUSE_BASE
gcode: _PAUSE_BASE {rawparams}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: _RESUME_BASE
gcode: _RESUME_BASE {rawparams}
