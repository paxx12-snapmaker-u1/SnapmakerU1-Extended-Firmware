[gcode_macro _TOOLCHANGE_MACRO]
rename_existing: _TOOLCHANGE_MACRO_BASE
gcode:
    {% set t = params.T|int %}
    {% set cur = printer.toolhead.extruder %}
    {% set fans = {'extruder': 'fan', 'extruder1': 'e1_fan', 'extruder2': 'e2_fan', 'extruder3': 'e3_fan'} %}

    # 1. Async Pre-Heat Hook
    # _ASYNC_PREHEAT_TOOL T={t}

    # 2. Pre-Dock Anti-Ooze Retraction
    {% if cur != 'extruder' ~ (t if t > 0 else '') %}
        # Save current state
        SAVE_GCODE_STATE NAME=TOOLCHANGE_STATE
        
        G91
        # Retract 1.2mm at 60mm/s
        {% if printer[printer.toolhead.extruder].can_extrude %}
            M83
            G1 E-1.2 F3600
        {% endif %}
        
        # 3. Dock-Alley Z-Hop (0.5mm instead of 1.0mm)
        {% if "z" in printer.toolhead.homed_axes %}
            G1 Z0.5 F3000
        {% endif %}
        G90

        # 4. Parked Tool Fan Auto-Suppression
        {% if cur in fans %}
            {% set fan_name = fans[cur] %}
            # Save the current fan speed
            {% if cur == 'extruder' %}
                M106 S0
            {% else %}
                SET_FAN_SPEED FAN={fan_name} SPEED=0
            {% endif %}
        {% endif %}

        # Execute native toolchange
        {% if t == 0 %} T0.1 {% elif t == 1 %} T1.1 {% elif t == 2 %} T2.1 {% elif t == 3 %} T3.1 {% endif %}

        # Undo Z-hop
        {% if "z" in printer.toolhead.homed_axes %}
            G91
            G1 Z-0.5 F3000
            G90
        {% endif %}
        
        # Restore state
        RESTORE_GCODE_STATE NAME=TOOLCHANGE_STATE
    {% else %}
        M118 Tool {t} is already active
    {% endif %}
