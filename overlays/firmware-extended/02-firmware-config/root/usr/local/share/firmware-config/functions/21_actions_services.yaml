actions:
  services:
    items:
      update-octoeverywhere:
        label: Update OctoEverywhere
        description: Update the OctoEverywhere plugin.
        cmd:
          - /bin/bash
          - -xc
          - |
            echo ">> Updating OctoEverywhere..."
            /usr/local/bin/octoeverywhere-pkg update
            echo ">> Restarting OctoEverywhere service..."
            /etc/init.d/S99cloud restart
        message: "Updating OctoEverywhere..."

      restart-klipper:
        label: Restart Klipper
        description: Restart the Klipper firmware service.
        confirm: true
        cmd:
          - /etc/init.d/S60klipper
          - restart
        message: "Restarting Klipper..."

      restart-moonraker:
        label: Restart Moonraker
        description: Restart the Moonraker API server.
        confirm: true
        cmd:
          - /etc/init.d/S61moonraker
          - restart
        message: "Restarting Moonraker..."
