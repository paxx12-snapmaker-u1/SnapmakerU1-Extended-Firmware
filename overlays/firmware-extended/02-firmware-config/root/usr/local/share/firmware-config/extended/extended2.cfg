[web]
# Web interface frontend: fluidd, mainsail
frontend: fluidd
# Enable access at http://<printer-ip>/firmware-config/: true, false
firmware_config: true
# Enable access at http://<printer-ip>/screen/: true, false
remote_screen: false

[camera]
# Internal (Case) camera options: paxx12, snapmaker, none
internal: paxx12
# Internal (Case) camera resolution/framerate preset, resolution is always 1080p: 1080p30, 1080p25, 1080p15, 1080p5
# internal_resolution: 1080p25
# External (USB) camera options: paxx12, none
usb: none
# External (USB) camera resolution/framerate preset: 1080p30, 1080p25, 1080p5, 720p30, 720p25, 720p5, 360p30, 360p25, 360p5
# usb_resolution: 1080p25
# Enable RTSP streaming server: true, false
rtsp: false

[components]
# Filament tag detection: external, snapmaker, openrfid, openrfid-generic
# rfid: snapmaker
# Firmware-update check: none, stable, testing, develop
# upgrade: none
# Touchscreen GUI: snapmaker, helixscreen
# gui: snapmaker

[remote_access]
# Enable SSH access: true, false
ssh: false
# VPN provider for remote access: none, tailscale
# Must SSH and run "tailscale up" to complete login flow
vpn: none
# Cloud: none, octoeverywhere
# - none - No cloud services enabled.
# - octoeverywhere - OctoEverywhere.com cloud-based remote access service
cloud: none

[https]
# Serve the web interface over HTTPS: none, self_signed, manual, acme
# - self_signed - certificate generated on the printer
# - manual - extended/tls/cert.pem (full chain) and extended/tls/key.pem
# - acme - certificate from an ACME CA (Let's Encrypt, ZeroSSL, step-ca, ...), renewed automatically
mode: none
# Plain HTTP on port 80 while HTTPS is enabled: redirect, serve, off
# http: redirect
# HTTPS port
# port: 443
# Extra names/IPs for the self-signed certificate, comma separated
# self_signed_names: printer.lan, 192.168.1.50
# ACME CA directory URL or acme.sh shortcode (letsencrypt, letsencrypt_test, zerossl, google, ...)
# For a private CA, put its root certificate in extended/tls/acme-ca.pem
# acme_server: letsencrypt
# acme_domains: printer.example.com
# acme_email: you@example.com
# ACME challenge: http, dns
# acme_challenge: http
# acme.sh DNS provider, e.g. cf or rfc2136; credentials go in extended/tls/acme.env
# acme_dns_provider: cf
# Fixed wait in seconds instead of checking public DNS (needed without internet)
# acme_dns_sleep: 30
# EAB credentials (ACME_EAB_KID, ACME_EAB_HMAC_KEY) also go in extended/tls/acme.env
# Require client certificates signed by extended/tls/client-ca.pem: true, false
# mtls: false
# Moonraker port 7125 listens on: all, localhost
# moonraker_bind: all

[monitoring]
# Enable Klipper Prometheus exporter on specified address
# klipper_exporter: :9101

# Spoolman server URL for filament tracking; managed via firmware-config.
# Example: host: http://192.168.1.100:7912
[spoolman]
