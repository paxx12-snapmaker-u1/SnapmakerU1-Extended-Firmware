settings:
  snapmaker_components:
    items:
      chamber_heater:
        options:
          auto:
            label: Panda Auto (Recommended)
            confirm: |
              WARNING: Panda Breath significantly raises sustained enclosure temperatures, accelerating wear on electronics, motors, and other components beyond their rated conditions. Any damage attributable to elevated thermal stress is unlikely to be covered under warranty. Additional motherboard cooling is required before use — see the documentation for details.

              Before enabling Panda Breath auto mode, complete all of the following steps:

              1. Install additional active cooling on the motherboard (see documentation).
              2. Ensure the Panda Breath device is running firmware v1.0.3.
              3. Configure a static DHCP lease for this printer on your router — the printer IP is embedded into the Panda Breath device and must not change after a reboot.
              4. Configure a static DHCP lease for the Panda Breath device on your router — Klipper will connect to it by IP address on every print.
              5. Power-cycle the Panda Breath device and wait at least 5 seconds before proceeding.
              6. Enter the Panda Breath IP address in the field below.

              Auto mode heats the chamber with Klipper first, then hands off hold and cool-down behaviour to Panda native auto mode.

              (If you have flashed your Panda Breath with DragonBreath open firmware instead, use the DragonBreath option below.)
            inputs:
              - name: ACKNOWLEDGED
                label: "Type \"I UNDERSTAND\" to confirm you have read the documentation and accept the warranty and longevity risks"
                placeholder: "I UNDERSTAND"
                regex: '^I UNDERSTAND$'
              - name: PANDA_BREATH_IP
                label: Panda Breath IP Address
                placeholder: "192.168.1.100"
                regex: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
            cmd:
              - bash
              - -ec
              - |
                CFG=/oem/printer_data/config/extended/klipper
                if test -f "$CFG/dragonbreath.cfg"; then
                  echo "ERROR: DragonBreath is currently enabled. Set the chamber heater to"
                  echo "       Disabled first, then enable Panda Auto."
                  exit 1
                fi

                echo ""
                echo ">> Detecting printer IP address..."
                PRINTER_IP=$((ip -4 -o addr show eth0 2>/dev/null || ip -4 -o addr show wlan0 2>/dev/null) | awk '{print $4}' | cut -d/ -f1)

                echo ""
                echo ">> Binding Panda Breath at ${PANDA_BREATH_IP} to printer at ${PRINTER_IP}..."
                /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" bind-klipper --printer-ip "${PRINTER_IP}"

                echo ""
                echo ">> Writing configuration..."
                mkdir -p "$CFG"
                cp -n /usr/local/share/firmware-config/tweaks/klipper/panda_breath.cfg "$CFG/panda_breath.cfg"
                /usr/local/bin/extended-config.py add "$CFG/panda_breath.cfg" panda_breath host "${PANDA_BREATH_IP}"
                /usr/local/bin/extended-config.py uncomment "$CFG/panda_breath.cfg" "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg"
                /usr/local/bin/extended-config.py comment "$CFG/panda_breath.cfg" "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg"
                chown lava:lava "$CFG/panda_breath.cfg"

                echo ""
                echo ">> Panda Breath auto mode enabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
          manual:
            label: Manual (Advanced)
            hidden: true
            confirm: |
              WARNING: Panda Breath significantly raises sustained enclosure temperatures, accelerating wear on electronics, motors, and other components beyond their rated conditions. Any damage attributable to elevated thermal stress is unlikely to be covered under warranty. Additional motherboard cooling is required before use — see the documentation for details.

              Before enabling Panda Breath manual mode, complete all of the following steps:

              1. Install additional active cooling on the motherboard (see documentation).
              2. Ensure the Panda Breath device is running firmware v1.0.3.
              3. Configure a static DHCP lease for this printer on your router — the printer IP is embedded into the Panda Breath device and must not change after a reboot.
              4. Configure a static DHCP lease for the Panda Breath device on your router — Klipper will connect to it by IP address on every print.
              5. Power-cycle the Panda Breath device and wait at least 5 seconds before proceeding.
              6. Enter the Panda Breath IP address in the field below.

              Manual mode is a legacy fallback that may be less safe if the device or network connectivity is lost during a print.
            inputs:
              - name: ACKNOWLEDGED
                label: "Type \"I UNDERSTAND\" to confirm you have read the documentation and accept the warranty and longevity risks"
                placeholder: "I UNDERSTAND"
                regex: '^I UNDERSTAND$'
              - name: PANDA_BREATH_IP
                label: Panda Breath IP Address
                placeholder: "192.168.1.100"
                regex: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
            cmd:
              - bash
              - -ec
              - |
                CFG=/oem/printer_data/config/extended/klipper
                if test -f "$CFG/dragonbreath.cfg"; then
                  echo "ERROR: DragonBreath is currently enabled. Set the chamber heater to"
                  echo "       Disabled first, then enable Panda Manual."
                  exit 1
                fi

                echo ""
                echo ">> Detecting printer IP address..."
                PRINTER_IP=$((ip -4 -o addr show eth0 2>/dev/null || ip -4 -o addr show wlan0 2>/dev/null) | awk '{print $4}' | cut -d/ -f1)

                echo ""
                echo ">> Binding Panda Breath at ${PANDA_BREATH_IP} to printer at ${PRINTER_IP}..."
                /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" bind-klipper --printer-ip "${PRINTER_IP}"

                echo ""
                echo ">> Writing configuration..."
                mkdir -p "$CFG"
                cp -n /usr/local/share/firmware-config/tweaks/klipper/panda_breath.cfg "$CFG/panda_breath.cfg"
                /usr/local/bin/extended-config.py add "$CFG/panda_breath.cfg" panda_breath host "${PANDA_BREATH_IP}"
                /usr/local/bin/extended-config.py comment "$CFG/panda_breath.cfg" "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg"
                /usr/local/bin/extended-config.py uncomment "$CFG/panda_breath.cfg" "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg"
                chown lava:lava "$CFG/panda_breath.cfg"
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg "$CFG/panda_breath_heater.cfg"

                echo ""
                echo ">> Panda Breath manual mode enabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
