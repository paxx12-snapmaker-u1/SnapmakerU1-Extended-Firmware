# Panda Breath — Connection Settings
# This file is used as the initial template copied into the user config directory.
# To change settings after enabling Panda Breath, edit the user-owned copy in:
#   /home/lava/printer_data/config/extended/klipper/panda_breath.cfg
# The managed auto-mode heater macros are included below (uncommented by
# firmware-config when Panda Auto is enabled). Uses the WebSocket transport
# (firmware: stock) — no MQTT.

[panda_breath]
firmware: stock
# You may need to change the host to the IP address of your Panda Breath device if .local resolution fails
host: PandaBreath.local
port: 80

# [include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg]
