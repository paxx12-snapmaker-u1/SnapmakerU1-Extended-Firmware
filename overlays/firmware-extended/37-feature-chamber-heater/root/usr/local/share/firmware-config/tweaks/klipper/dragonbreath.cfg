# DragonBreath — Connection Settings
# This file is used as the initial template copied into the user config directory.
# To change settings after enabling DragonBreath, edit the user-owned copy in:
#   /home/lava/printer_data/config/extended/klipper/dragonbreath.cfg
# The managed heater config + M141/M191 macros are provided by the include below
# (dragonbreath_heater.cfg) and are overwritten on firmware upgrades.

[dragonbreath]
# IP address of your DragonBreath device. Set a static DHCP lease for it — Klipper
# connects to it by IP on every print. (openvent.local may work if mDNS resolves.)
host: 192.168.1.100
#port: 80
# X-DragonBreath-Auth value. Leave unset (defaults to "web") unless you configured
# a control token on the device (NVS ctl_token); then set it to match.
#token: web
#poll_interval: 2.0
# M141/M191 come from the managed heater cfg below, not the module.
register_macros: False

[include /usr/local/share/firmware-config/tweaks/klipper/dragonbreath_heater.cfg]
