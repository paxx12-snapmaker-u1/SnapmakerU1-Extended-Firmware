# DragonBreath — Managed Heater Configuration & Macros
# This file is managed by firmware-config and must not be edited.
# It is included by dragonbreath.cfg and will be overwritten on firmware upgrades.
#
# DragonBreath holds the chamber target autonomously on the device (its own
# bang-bang + comms watchdog). The dragonbreath Klipper module pushes the target
# and keeps a heartbeat lease so the device holds temp while Klipper is alive; if
# Klipper crashes/stops, the heartbeats stop and the device latches the heater
# off. So there is a single "auto-hold" mode — no auto/manual split.

[heater_generic dragonbreath]
heater_pin: dragonbreath:pwm
sensor_type: dragonbreath
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 75
# DragonBreath firmware hard-caps the settable target at 70 C.

[verify_heater dragonbreath]
# Slow external chamber heater with coarse 1C reporting — generous limits avoid
# false positives on long chamber holds.
max_error: 600
check_gain_time: 360
hysteresis: 5
heating_gain: 1

# Chamber filtration blower (fan-only). The DragonBreath blower is on/off only
# (a zero-cross TRIAC, never phase-chopped), so it is a BINARY output — an on/off
# toggle in Fluidd, not a speed slider. It never engages the heater. Drive it from
# the UI or a macro: SET_PIN PIN=dragonbreath_filter VALUE=1 / VALUE=0. The device
# rejects turning it ON while heating/cooling (safety); turning it OFF always works.
[output_pin dragonbreath_filter]
pin: dragonbreath:filter

[gcode_macro M141]
description: Set chamber temperature (DragonBreath)
gcode:
    {% set s = params.S|default(0)|float %}
    SET_HEATER_TEMPERATURE HEATER="dragonbreath" TARGET={s}

[gcode_macro M191]
description: Set chamber temperature and wait (DragonBreath)
gcode:
    {% set s = params.S|default(0)|float %}
    SET_HEATER_TEMPERATURE HEATER="dragonbreath" TARGET={s}
    {% if s > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic dragonbreath" MINIMUM={s}
    {% endif %}
