settings:
  snapmaker_components:
    items:
      chamber_heater:
        label: PandaBreath / DragonBreath Chamber Heater
        description: Chamber heater integration — stock Panda Breath (auto) or DragonBreath open firmware.
        help_url: https://github.com/plastikman/DragonBreath
        get_cmd:
          - bash
          - -c
          - |
            if test -f /oem/printer_data/config/extended/klipper/dragonbreath.cfg; then
              echo "dragonbreath"
            elif test -f /oem/printer_data/config/extended/klipper/panda_breath.cfg; then
              echo "panda-auto"
            else
              echo "disabled"
            fi
        options:
          disabled:
            label: Disabled
            cmd:
              - bash
              - -ec
              - |
                if PANDA_BREATH_IP=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/klipper/panda_breath.cfg panda_breath host 2>/dev/null); then
                  echo ""
                  echo ">> Unbinding Panda Breath at ${PANDA_BREATH_IP}..."
                  /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" unbind || true
                fi

                echo ""
                echo ">> Removing chamber heater configuration..."
                rm -f /oem/printer_data/config/extended/klipper/panda_breath.cfg
                rm -f /oem/printer_data/config/extended/klipper/dragonbreath.cfg

                echo ""
                echo ">> Chamber heater disabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
          panda-auto:
            label: Panda Auto
            confirm: |
              WARNING: A chamber heater significantly raises sustained enclosure temperatures, accelerating wear on electronics, motors, and other components beyond their rated conditions. Any damage attributable to elevated thermal stress is unlikely to be covered under warranty. Additional motherboard cooling is required before use — see the documentation for details.

              Before enabling Panda Breath auto mode, complete all of the following steps:

              1. Install additional active cooling on the motherboard (see documentation).
              2. Ensure the Panda Breath device is running stock firmware v1.0.3+.
              3. Configure a static DHCP lease for this printer on your router — the printer IP is embedded into the Panda Breath device and must not change after a reboot.
              4. Configure a static DHCP lease for the Panda Breath device on your router — Klipper connects to it by IP address on every print.
              5. Power-cycle the Panda Breath device and wait at least 5 seconds before proceeding.
              6. Enter the Panda Breath IP address in the field below.

              Auto mode heats the chamber with Klipper first, then hands off hold and cool-down behaviour to Panda native auto mode.
            inputs:
              - name: ACKNOWLEDGED
                label: "Type \"I UNDERSTAND\" to confirm you have read the documentation and accept the warranty and longevity risks"
                placeholder: "I UNDERSTAND"
                regex: '^I UNDERSTAND$'
              - name: PANDA_BREATH_IP
                label: Panda Breath IP Address
                placeholder: "192.168.1.100"
                regex: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
            cmd:
              - bash
              - -ec
              - |
                if test -f /oem/printer_data/config/extended/klipper/dragonbreath.cfg; then
                  echo "ERROR: DragonBreath is currently enabled. Set the chamber heater to"
                  echo "       Disabled first, then enable Panda Auto."
                  exit 1
                fi

                echo ""
                echo ">> Detecting printer IP address..."
                PRINTER_IP=$((ip -4 -o addr show eth0 2>/dev/null || ip -4 -o addr show wlan0 2>/dev/null) | awk '{print $4}' | cut -d/ -f1)

                echo ""
                echo ">> Binding Panda Breath at ${PANDA_BREATH_IP} to printer at ${PRINTER_IP}..."
                /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" bind-klipper --printer-ip "${PRINTER_IP}"

                echo ""
                echo ">> Writing configuration..."
                mkdir -p /oem/printer_data/config/extended/klipper
                cp -n /usr/local/share/firmware-config/tweaks/klipper/panda_breath.cfg /oem/printer_data/config/extended/klipper/panda_breath.cfg
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/klipper/panda_breath.cfg panda_breath host "${PANDA_BREATH_IP}"
                /usr/local/bin/extended-config.py uncomment /oem/printer_data/config/extended/klipper/panda_breath.cfg "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg"
                chown lava:lava /oem/printer_data/config/extended/klipper/panda_breath.cfg

                echo ""
                echo ">> Panda Breath auto mode enabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
          dragonbreath:
            label: DragonBreath
            confirm: |
              WARNING: A chamber heater raises sustained enclosure temperatures, accelerating wear on electronics and motors beyond their rated conditions — likely NOT warranty-covered. Additional motherboard cooling is required (see docs).

              DragonBreath is community open firmware for a MAINS-POWERED heater. NO WARRANTY — a fault could cause overheating, fire, or damage. Use at your own risk; never run it unattended.

              Before enabling:
              1. Add active cooling to the motherboard (see docs).
              2. Flash DragonBreath firmware on the Panda Breath and provision its Wi-Fi.
              3. Give the DragonBreath device a static DHCP lease — Klipper connects by IP.
              4. Enter its IP below.

              Advanced: to use a device control token (NVS ctl_token), add a "token:" line to the DragonBreath config after enabling (see docs).
            inputs:
              - name: ACKNOWLEDGED
                label: "Type \"I UNDERSTAND\" to confirm you have read the documentation and accept the warranty, safety, and longevity risks"
                placeholder: "I UNDERSTAND"
                regex: '^I UNDERSTAND$'
              - name: DRAGONBREATH_IP
                label: DragonBreath Device IP Address
                placeholder: "192.168.1.100"
                regex: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
            cmd:
              - bash
              - -ec
              - |
                if test -f /oem/printer_data/config/extended/klipper/panda_breath.cfg; then
                  echo "ERROR: Panda Auto is currently enabled. Set the chamber heater to"
                  echo "       Disabled first, then enable DragonBreath."
                  exit 1
                fi

                echo ""
                echo ">> Writing DragonBreath configuration..."
                mkdir -p /oem/printer_data/config/extended/klipper
                cp -n /usr/local/share/firmware-config/tweaks/klipper/dragonbreath.cfg /oem/printer_data/config/extended/klipper/dragonbreath.cfg
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/klipper/dragonbreath.cfg dragonbreath host "${DRAGONBREATH_IP}"
                chown lava:lava /oem/printer_data/config/extended/klipper/dragonbreath.cfg

                echo ""
                echo ">> DragonBreath enabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
        default: disabled
