settings:
  snapmaker_components:
    items:
      chamber_heater:
        label: DragonBreath Chamber Heater
        description: Chamber heater integration via DragonBreath open firmware. Stock Panda Breath users get a "Convert to DragonBreath" action (converts over Wi-Fi, no USB).
        help_url: https://github.com/plastikman/DragonBreath
        get_cmd:
          - bash
          - -c
          - |
            CFG=/oem/printer_data/config/extended/klipper
            if test -f "$CFG/dragonbreath.cfg"; then
              echo "dragonbreath"
            else
              # Includes the "stock Panda pending migration" case: the S58 guard has
              # neutralized panda_breath.cfg, so the heater is genuinely disabled until
              # the user runs the "Convert to DragonBreath" action (which appears
              # separately, gated on the .needs-migration flag).
              echo "disabled"
            fi
        options:
          disabled:
            label: Disabled
            cmd:
              - bash
              - -ec
              - |
                CFG=/oem/printer_data/config/extended/klipper

                echo ""
                echo ">> Removing chamber heater configuration..."
                # Removing the pending-migration files here is an explicit decline:
                # the Convert action will no longer appear; the manual DragonBreath
                # route stays available.
                rm -f "$CFG/panda_breath.cfg" "$CFG/panda_breath.cfg.pending-migration"
                rm -f "$CFG/dragonbreath.cfg"
                rm -f "$CFG/.needs-migration"

                echo ""
                echo ">> Chamber heater disabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
          dragonbreath:
            label: DragonBreath
            confirm: |
              WARNING: A chamber heater raises sustained enclosure temperatures, accelerating wear on electronics and motors beyond their rated conditions — likely NOT warranty-covered. Additional motherboard cooling is required (see docs).

              DragonBreath is community open firmware for a MAINS-POWERED heater. NO WARRANTY — a fault could cause overheating, fire, or damage. Use at your own risk; never run it unattended.

              Before enabling:
              1. Add active cooling to the motherboard (see docs).
              2. Flash DragonBreath firmware on the Panda Breath and provision its Wi-Fi.
              3. Give the DragonBreath device a static DHCP lease — Klipper connects by IP.
              4. Enter its IP below.

              (If you are still on stock Panda firmware, use the "Convert to DragonBreath" action instead — it flashes DragonBreath for you over Wi-Fi.)

              Advanced: to use a device control token (NVS ctl_token), add a "token:" line to the DragonBreath config after enabling (see docs).
            inputs:
              - name: ACKNOWLEDGED
                label: "Type \"I UNDERSTAND\" to confirm you have read the documentation and accept the warranty, safety, and longevity risks"
                placeholder: "I UNDERSTAND"
                regex: '^I UNDERSTAND$'
              - name: DRAGONBREATH_IP
                label: DragonBreath Device IP Address
                placeholder: "192.168.1.100"
                regex: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
            cmd:
              - bash
              - -ec
              - |
                CFG=/oem/printer_data/config/extended/klipper
                if test -f "$CFG/panda_breath.cfg" || test -f "$CFG/panda_breath.cfg.pending-migration"; then
                  echo "ERROR: A stock Panda Breath configuration is still present. Use the"
                  echo "       \"Convert to DragonBreath\" action to migrate it, or set Disabled first."
                  exit 1
                fi

                echo ""
                echo ">> Writing DragonBreath configuration..."
                mkdir -p "$CFG"
                cp -n /usr/local/share/firmware-config/tweaks/klipper/dragonbreath.cfg "$CFG/dragonbreath.cfg"
                /usr/local/bin/extended-config.py add "$CFG/dragonbreath.cfg" dragonbreath host "${DRAGONBREATH_IP}"
                chown lava:lava "$CFG/dragonbreath.cfg"
                rm -f "$CFG/.needs-migration"

                echo ""
                echo ">> DragonBreath enabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
        default: disabled
