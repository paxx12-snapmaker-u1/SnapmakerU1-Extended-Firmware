<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filament Manager</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header>
    <h1>Filament Manager</h1>
    <div class="status-bar">
        <span id="connection-status" class="status-dot disconnected"></span>
        <span id="connection-text">Connecting…</span>
        <button id="refresh-all" class="header-btn" disabled>Read spool tags</button>
    </div>
</header>

<main class="content">
    <div id="channels-grid" class="channels-grid"></div>
    <div id="status-message" class="status-message"></div>
</main>

<!-- User Filament Modal -->
<div id="overwrite-modal" class="tag-edit-overlay" style="display:none">
    <div class="tag-edit-dialog" role="dialog" aria-modal="true">
        <div class="tag-edit-header">
            <h2 class="tag-edit-title" id="overwrite-modal-title">User Filament</h2>
            <button class="tag-edit-close modal-close-ow" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="tag-edit-body">
            <form id="overwrite-form">
                <input type="hidden" name="channel" value="0">

                <div id="overwrite-warning" class="overwrite-warning" style="display:none"></div>

                <label class="form-label field-block">Material *
                    <div class="palette" id="ow-material-palette"></div>
                    <input type="hidden" name="type" id="ow-material-value">
                </label>

                <label class="form-label field-block">Brand *
                    <div class="palette" id="ow-brand-palette"></div>
                    <input type="text" id="ow-brand-custom" class="brand-custom-input" placeholder="Enter custom brand" style="display:none">
                    <input type="hidden" name="brand" id="ow-brand-value" value="Generic">
                </label>

                <label class="form-label field-block">Subtype
                    <div class="palette" id="ow-subtype-palette"></div>
                    <input type="hidden" name="subtype" id="ow-subtype-value" value="Basic">
                </label>

                <label class="form-label field-block">Colors
                    <div class="color-list" id="ow-color-list"></div>
                    <div class="opacity-input-group">
                        <span class="opacity-label">Opacity</span>
                        <input type="range" id="ow-color-opacity" min="0" max="100" value="100" step="1">
                        <span class="opacity-value" id="ow-color-opacity-value">100%</span>
                    </div>
                </label>
                <input type="hidden" name="alpha" id="ow-color-alpha" value="FF">
                <div class="modal-actions">
                    <button type="button" class="modal-btn-cancel modal-close-ow">Cancel</button>
                    <button type="submit" class="modal-btn-submit">Save Filament</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="info-popover" class="info-popover" style="display:none"></div>

<!-- Tag Mismatch Modal -->
<div id="mismatch-modal" class="tag-edit-overlay" style="display:none">
    <div class="tag-edit-dialog" role="dialog" aria-modal="true">
        <div class="tag-edit-header">
            <h2 class="tag-edit-title" id="mismatch-modal-title">Tag Mismatch</h2>
            <button class="tag-edit-close" id="mismatch-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="tag-edit-body">
            <p class="mismatch-intro">The RFID tag currently detected differs from the printer's loaded configuration.</p>
            <div id="mismatch-content" class="mismatch-table"></div>
            <div class="modal-actions">
                <button type="button" id="mismatch-apply" class="modal-btn-submit">Apply RFID to Printer</button>
                <button type="button" id="mismatch-cancel" class="modal-btn-cancel">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Spoolman Spool Modal -->
<div id="spoolman-modal" class="tag-edit-overlay" style="display:none">
    <div class="tag-edit-dialog spoolman-dialog" role="dialog" aria-modal="true">
        <div class="tag-edit-header">
            <h2 class="tag-edit-title" id="spoolman-modal-title">Spoolman</h2>
            <button class="tag-edit-close" id="spoolman-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="tag-edit-body spoolman-body">
            <p class="dialog-intro" id="spoolman-intro"></p>

            <div class="dialog-tabs">
                <button type="button" class="dialog-tab active" id="spool-tab-assign">Assign</button>
                <button type="button" class="dialog-tab" id="spool-tab-create">Create</button>
            </div>

            <div id="spool-panel-assign" class="spoolman-body">
                <input type="text" id="spoolman-search" class="spoolman-search" placeholder="Filter by name, brand, or material…" autocomplete="off">
                <div id="spoolman-list" class="spoolman-list"></div>
            </div>

            <div id="spool-panel-create" style="display:none">
                <form id="create-spool-form">
                    <div id="create-spool-notice" class="overwrite-warning" style="display:none"></div>

                    <label class="form-label field-block">Material *
                        <div class="palette" id="cs-material-palette"></div>
                        <input type="hidden" name="material" id="cs-material-value">
                    </label>

                    <label class="form-label field-block">Brand *
                        <div class="palette" id="cs-brand-palette"></div>
                        <input type="text" id="cs-brand-custom" class="brand-custom-input" placeholder="Enter custom brand" style="display:none">
                        <input type="hidden" name="vendor" id="cs-brand-value" value="Generic">
                    </label>

                    <label class="form-label field-block">Subtype
                        <div class="palette" id="cs-subtype-palette"></div>
                        <input type="hidden" name="variant" id="cs-subtype-value" value="Basic">
                    </label>

                    <div class="form-row">
                        <label class="form-label">Color *
                            <div class="color-input-group">
                                <input type="color" id="cs-color-picker" aria-label="Pick colour">
                                <input type="text" name="color" id="cs-color-value" required maxlength="7" spellcheck="false" autocomplete="off">
                            </div>
                        </label>
                        <label class="form-label">Filament name *
                            <input type="text" name="name" required autocomplete="off">
                        </label>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Filament on spool (g) *
                            <input type="number" name="net_weight" required min="1" step="any">
                        </label>
                        <label class="form-label">Empty spool / tare (g)
                            <input type="number" name="tare_weight" min="0" step="any" placeholder="Optional">
                        </label>
                    </div>

                    <details class="advanced-section">
                        <summary>Advanced</summary>
                        <div class="form-row">
                            <label class="form-label">Diameter (mm)
                                <input type="number" name="diameter" min="0.1" max="5" step="0.01">
                            </label>
                            <label class="form-label">Density (g/cm&sup3;)
                                <input type="number" name="density" min="0.5" max="3" step="0.01">
                            </label>
                            <label class="form-label">Nozzle (&deg;C)
                                <input type="number" name="nozzle_temp" min="1" max="500" step="1">
                            </label>
                            <label class="form-label">Bed (&deg;C)
                                <input type="number" name="bed_temp" min="1" max="200" step="1">
                            </label>
                        </div>
                    </details>

                    <div class="create-spool-source">
                        <div><span>Card UID</span><strong id="create-spool-uid">-</strong></div>
                    </div>

                </form>
            </div>
        </div>

        <div class="tag-edit-footer">
            <div class="modal-actions" id="spool-actions-assign">
                <button type="button" id="spoolman-cancel" class="modal-btn-cancel">Cancel</button>
                <button type="button" id="spoolman-clear" class="modal-btn-danger">Clear</button>
            </div>
            <div class="modal-actions" id="spool-actions-create" style="display:none">
                <button type="button" id="create-spool-cancel" class="modal-btn-cancel">Cancel</button>
                <button type="submit" form="create-spool-form" id="create-spool-submit" class="modal-btn-submit">Create and Assign</button>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation modal -->
<div id="confirm-modal" class="tag-edit-overlay" style="display:none">
    <div class="tag-edit-dialog confirm-dialog" role="dialog" aria-modal="true">
        <div class="tag-edit-header">
            <h2 class="tag-edit-title" id="confirm-title">Confirm</h2>
            <button class="tag-edit-close" id="confirm-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="tag-edit-body">
            <div id="confirm-content" class="confirm-content"></div>
            <div class="modal-actions">
                <button type="button" id="confirm-cancel" class="modal-btn-cancel">Cancel</button>
                <button type="button" id="confirm-accept" class="modal-btn-submit">Confirm</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js?v=3"></script>
</body>
</html>
