settings:
  remote_access:
    items:
      ssh:
        label: SSH Access
        description: Enable remote shell access to the printer over SSH.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - remote_access
          - ssh
          - "false"
        options:
          "true":
            label: Enabled
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg remote_access ssh true &&
                /etc/init.d/S50dropbear restart
          "false":
            label: Disabled
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg remote_access ssh false &&
                /etc/init.d/S50dropbear stop
        default: "false"
