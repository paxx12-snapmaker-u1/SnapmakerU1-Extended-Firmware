[gcode_macro M109]
rename_existing: M109.1
description: Move active toolhead to side auxiliary blower (cavity_fan) for fast nozzle cooldown with single-pass pre-print fly-through
variable_flythrough_clean_target: 0.0
variable_flythrough_cool_target: 0.0
variable_post_flow_cal_ext: ""
gcode:
    {% set s_val = params.S|default(-1)|float %}
    {% set a_val = params.A|default(1)|int %}
    {% set t_idx = params.T|default(-1)|int %}
    {% set active_ext = printer.toolhead.extruder %}
    {% set fly_clean = printer["gcode_macro M109"].flythrough_clean_target|default(0.0)|float %}
    {% set fly_cool = printer["gcode_macro M109"].flythrough_cool_target|default(0.0)|float %}
    {% set post_flow_ext = printer["gcode_macro M109"].post_flow_cal_ext|default("")|string %}
    {% set z_homed = ("z" in printer.toolhead.homed_axes) %}
    {% if fly_clean > 0.0 %}
        SET_GCODE_VARIABLE MACRO=M109 VARIABLE=flythrough_clean_target VALUE=0.0
        SET_GCODE_VARIABLE MACRO=M109 VARIABLE=flythrough_cool_target VALUE=0.0
    {% endif %}
    {% if t_idx < 0 %}
        {% set target_ext = active_ext %}
    {% else %}
        {% if a_val != 0 and printer.print_task_config is defined %}
            {% set mapped_idx = printer.print_task_config.extruder_map_table[t_idx]|default(t_idx)|int %}
        {% else %}
            {% set mapped_idx = t_idx %}
        {% endif %}
        {% if mapped_idx == 0 %}
            {% set target_ext = "extruder" %}
        {% else %}
            {% set target_ext = "extruder" ~ mapped_idx %}
        {% endif %}
    {% endif %}
    {% if post_flow_ext != "" and (target_ext != post_flow_ext or active_ext != post_flow_ext) %}
        SET_GCODE_VARIABLE MACRO=M109 VARIABLE=post_flow_cal_ext VALUE="''"
        {% set post_flow_ext = "" %}
    {% endif %}

    {% set ns = namespace(skip_m109=false) %}
    {% if target_ext == active_ext and "xy" in printer.toolhead.homed_axes and s_val > 0 %}
        {% set cur_temp = printer[active_ext].temperature|float %}
        {% set cur_target = printer[active_ext].target|float %}

        {% if post_flow_ext == active_ext %}
            {% if cur_temp < 150.0 %}
                SET_GCODE_VARIABLE MACRO=M109 VARIABLE=post_flow_cal_ext VALUE="''"
                {% set post_flow_ext = "" %}
            {% elif s_val > 185.0 %}
                # Post-flow-calibration pre-extrude heat (M109 T{initial_extruder} S{T_print}):
                # Active toolhead just extruded ~640mm during flow calibration and was cooled to 170C
                # and wiped in INNER_FLOW_CALIB_END_BASE_DISCARD seconds ago. Skip reheating to T_print.
                SET_HEATER_TEMPERATURE HEATER={active_ext} TARGET={s_val - 50.0}
                {% set ns.skip_m109 = true %}
            {% elif s_val >= 110.0 and s_val <= 185.0 and (cur_target - s_val)|abs <= 5.0 %}
                # Post-flow-calibration First Cooldown (M109 T{initial_extruder} S{T_print - 90}):
                # Nozzle is already at ~170C. Hold at s_val + 40C (170C for PLA) and arm Stage 2
                # fly-through so rough G28 Z and DETECT_BED_PLATE run immediately without moving to X5 Y140.
                {% set next_clean_target = s_val + 40.0 %}
                SET_HEATER_TEMPERATURE HEATER={active_ext} TARGET={next_clean_target}
                SET_GCODE_VARIABLE MACRO=M109 VARIABLE=flythrough_clean_target VALUE={next_clean_target}
                SET_GCODE_VARIABLE MACRO=M109 VARIABLE=flythrough_cool_target VALUE={s_val}
                {% set ns.skip_m109 = true %}
            {% else %}
                SET_GCODE_VARIABLE MACRO=M109 VARIABLE=post_flow_cal_ext VALUE="''"
                {% set post_flow_ext = "" %}
            {% endif %}
        {% endif %}

        {% if not ns.skip_m109 %}
            {% if fly_clean > 0.0 and (s_val - fly_clean)|abs <= 5.0 and cur_target > 0.0 and cur_temp >= (s_val - 15.0) %}
                # Fly-through stage 2 (M109 S{T_print - 50} before FINELY_CLEAN_NOZZLE_STAGE_1):
                # Nozzle is already in the ~165-170C cleaning window after rough G28 Z and DETECT_BED_PLATE.
                # Set heater target directly to fly_cool (e.g. 130C) and run cavity_fan so the nozzle
                # cools continuously toward 130C during FINELY_CLEAN_NOZZLE_STAGE_1 & STAGE_2 without reheating.
                SET_HEATER_TEMPERATURE HEATER={active_ext} TARGET={fly_cool}
                SET_FAN_SPEED FAN=cavity_fan SPEED=1
                {% if cur_temp > (s_val + 5.0) %}
                    TEMPERATURE_WAIT SENSOR={active_ext} MAXIMUM={s_val + 5.0}
                {% endif %}
                {% set ns.skip_m109 = true %}
            {% elif s_val >= 110.0 and s_val <= 185.0 and cur_target <= 185.0 and (cur_temp - s_val) >= 65.0 %}
                # Fly-through stage 1 (First Cooldown: T_print -> T_print - 90, e.g. 220C -> 130C):
                # Set heater target to s_val + 40C (e.g. 170C) and cool at the side blower down to
                # s_val + 58C (e.g. 188C), then return immediately so rough wipe, rough G28 Z, and
                # DETECT_BED_PLATE execute while the nozzle continues cooling into the 170C window.
                {% set start_x = printer.gcode_move.gcode_position.x|float %}
                {% set start_y = printer.gcode_move.gcode_position.y|float %}
                {% set start_z = printer.gcode_move.gcode_position.z|float %}
                {% set y_idle = 250.0 %}
                {% set flythrough_stop_temp = s_val + 58.0 %}
                {% set next_clean_target = s_val + 40.0 %}
                {% set hold_clean_temp = s_val + 40.0 %}

                SAVE_GCODE_STATE NAME=_fast_nozzle_cooldown_state
                G90
                {% if z_homed and start_z < 5.0 %}
                    G0 Z5 F10000
                {% endif %}
                {% if start_y > y_idle %}
                    MOVE_TO_XY_IDLE_POSITION_EXTRUDER
                {% endif %}

                SET_HEATER_TEMPERATURE HEATER={active_ext} TARGET={hold_clean_temp}
                SET_FAN_SPEED FAN=cavity_fan SPEED=1
                M106 S255
                G0 X5 Y140 F18000
                M400

                TEMPERATURE_WAIT SENSOR={active_ext} MAXIMUM={flythrough_stop_temp}

                SET_FAN_SPEED FAN=cavity_fan SPEED=0
                SET_GCODE_VARIABLE MACRO=M109 VARIABLE=flythrough_clean_target VALUE={next_clean_target}
                SET_GCODE_VARIABLE MACRO=M109 VARIABLE=flythrough_cool_target VALUE={s_val}

                {% if start_y > (y_idle + 35.0) %}
                    MOVE_TO_DISCARD_FILAMENT_POSITION
                {% elif start_y > y_idle %}
                    MOVE_TO_XY_IDLE_POSITION_EXTRUDER
                    G90
                    G0 X{start_x} Y{start_y} F18000
                {% else %}
                    G90
                    G0 X{start_x} Y{start_y} F18000
                {% endif %}
                M400
                RESTORE_GCODE_STATE NAME=_fast_nozzle_cooldown_state
                {% set ns.skip_m109 = true %}
            {% elif s_val <= 185.0 and cur_temp > (s_val + 4.0) %}
                # Standard fast cooldown (e.g. Second Cooldown from ~145C -> 130C before fine G28 Z,
                # or M109 S170 at the end of FLOW_CALIBRATE inside INNER_FLOW_CALIB_END_BASE_DISCARD):
                {% set start_x = printer.gcode_move.gcode_position.x|float %}
                {% set start_y = printer.gcode_move.gcode_position.y|float %}
                {% set start_z = printer.gcode_move.gcode_position.z|float %}
                {% set y_idle = 250.0 %}
                {% set early_stop_temp = s_val + 1.5 %}

                SAVE_GCODE_STATE NAME=_fast_nozzle_cooldown_state
                G90
                {% if z_homed and start_z < 5.0 %}
                    G0 Z5 F10000
                {% endif %}
                {% if start_y > y_idle %}
                    MOVE_TO_XY_IDLE_POSITION_EXTRUDER
                {% endif %}

                # Set target temperature directly and move to the left auxiliary blower stream (X5 Y140),
                # blowing at 100% until within 1.5C of target
                SET_HEATER_TEMPERATURE HEATER={active_ext} TARGET={s_val}
                SET_FAN_SPEED FAN=cavity_fan SPEED=1
                M106 S255
                G0 X5 Y140 F18000
                M400

                TEMPERATURE_WAIT SENSOR={active_ext} MAXIMUM={early_stop_temp}

                # Stop blowing for the final 1.5C so temperature slope flattens during the travel move
                # and M109 settles immediately without undershooting
                SET_FAN_SPEED FAN=cavity_fan SPEED=0
                M106 S0

                {% if start_y > (y_idle + 35.0) %}
                    MOVE_TO_DISCARD_FILAMENT_POSITION
                {% elif start_y > y_idle %}
                    MOVE_TO_XY_IDLE_POSITION_EXTRUDER
                    G90
                    G0 X{start_x} Y{start_y} F18000
                {% else %}
                    G90
                    G0 X{start_x} Y{start_y} F18000
                {% endif %}
                M400
                RESTORE_GCODE_STATE NAME=_fast_nozzle_cooldown_state

                {% if s_val == 170.0 and t_idx < 0 and cur_target > 185.0 and printer.print_stats.state == "printing" %}
                    SET_GCODE_VARIABLE MACRO=M109 VARIABLE=post_flow_cal_ext VALUE="'{active_ext}'"
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

    {% if not ns.skip_m109 %}
        M109.1 {rawparams}
    {% endif %}

[gcode_macro INNER_PREEXTRUDE_FILAMENT]
description: Skip redundant pre-extrude purge when active toolhead just completed pre-print flow calibration
gcode:
    {% set post_flow_ext = printer["gcode_macro M109"].post_flow_cal_ext|default("")|string %}
    {% if post_flow_ext != "" and post_flow_ext == printer.toolhead.extruder %}
        { action_respond_info("Fast Nozzle Cooldown: Skipping redundant pre-extrude on %s (already primed by flow calibration)" % (printer.toolhead.extruder)) }
        M400
    {% else %}
        {% set temp = params.TEMP | default(220) | int %}
        {% set speed = params.SPEED | default(360) | float %}
        {% set length = params.LENGTH | default(20) | float %}
        {% set retract_length = params.RETRACT_LENGTH | default(0.5) | abs %}
        {% set filament_soft = params.SOFT | default(False) %}
        {% if filament_soft == True %}
            {% set speed = 120 %}
            {% set length = 10 %}
        {% endif %}
        SAVE_GCODE_STATE NAME=preextrude
        SET_ACTION_CODE ACTION=PRINT_PREEXTRUDING
        MOVE_TO_DISCARD_FILAMENT_POSITION
        M204 S10000
        M109 S{temp}
        M83
        INNER_APPLY_FLOW_K EXTRUDER={printer.toolhead.extruder} APPLY=1
        G1 E{length} F{speed}
        INNER_APPLY_FLOW_K EXTRUDER={printer.toolhead.extruder} APPLY=0
        G1 E-{retract_length}
        M400
        M106 S255
        G4 P5000
        M400
        INNER_CUTOFF_BASE_DISCARD
        INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=4
        INNER_DISCARD_FILAMENT_BASE_DISCARD
        MOVE_TO_XY_IDLE_POSITION_EXTRUDER
        M107
        RESTORE_GCODE_STATE NAME=preextrude
        SET_ACTION_CODE ACTION=IDLE
    {% endif %}

[gcode_macro ROUGHLY_CLEAN_NOZZLE_WITH_DISCARD]
description: Skip redundant rough nozzle wipe when active toolhead was already wiped at the end of flow calibration
gcode:
    {% set post_flow_ext = printer["gcode_macro M109"].post_flow_cal_ext|default("")|string %}
    {% if post_flow_ext != "" and post_flow_ext == printer.toolhead.extruder %}
        SET_GCODE_VARIABLE MACRO=M109 VARIABLE=post_flow_cal_ext VALUE="''"
    {% else %}
        {% if post_flow_ext != "" %}
            SET_GCODE_VARIABLE MACRO=M109 VARIABLE=post_flow_cal_ext VALUE="''"
        {% endif %}
        MOVE_TO_DISCARD_FILAMENT_POSITION
        INNER_CUTOFF_BASE_DISCARD
        INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD
        INNER_DISCARD_FILAMENT_BASE_DISCARD
    {% endif %}
