settings:
  print_preferences:
    items:
      smart_flow_calibration:
        label: Smart Flow Calibration (Changed Lanes Only)
        description: When Flow Calibration is enabled for a print, skips calibrating extruders whose filament has not been unloaded, removed, or edited since their last successful flow calibration — saving ~3.5 minutes and up to ~640 mm (~2g) of purged filament per unchanged lane.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#smart-flow-calibration
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/smart_flow_calibration.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: Enabled
            confirm: "Enable Smart Flow Calibration? When Flow Calibration is checked for a print, lanes whose filament has remained loaded and unchanged since their last successful calibration will reuse their saved pressure advance value (saving ~3.5 min and up to ~640 mm / ~2g of purged filament per unchanged lane)."
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/smart_flow_calibration.cfg /oem/printer_data/config/extended/klipper/smart_flow_calibration.cfg &&
                echo "Smart flow calibration enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/smart_flow_calibration.cfg &&
                echo "Smart flow calibration disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
