[save_variables]
filename: /oem/printer_data/config/extended/smart_flow_vars.cfg

[gcode_macro _SMART_FLOW_CHECK_LANES]
description: Invalidate saved flow calibration state for any lane whose filament was removed, unloaded, or edited
gcode:
    {% if printer.save_variables is defined %}
        {% set svv = printer.save_variables.variables %}
        {% set ptc = printer.print_task_config|default({}) %}
        {% set left_feed = printer["filament_feed left"]|default({}) %}
        {% set right_feed = printer["filament_feed right"]|default({}) %}
        {% for i in range(4) %}
            {% set valid_key = "smart_flow_valid_e" ~ i %}
            {% if svv[valid_key]|default(0)|int == 1 %}
                {% set ext_name = "extruder" if i == 0 else "extruder" ~ i %}
                {% set feed_obj = left_feed if i < 2 else right_feed %}
                {% set feed_ch = feed_obj["extruder" ~ i]|default({}) %}
                {% set e_sensor = printer["filament_motion_sensor e" ~ i ~ "_filament"]|default({}) %}
                {% set vendor = ptc.filament_vendor[i]|default("NONE")|string if ptc.filament_vendor is defined else "NONE" %}
                {% set ftype = ptc.filament_type[i]|default("NONE")|string if ptc.filament_type is defined else "NONE" %}
                {% set subtype = ptc.filament_sub_type[i]|default("NONE")|string if ptc.filament_sub_type is defined else "NONE" %}
                {% set color = ptc.filament_color_rgba[i]|default("FFFFFFFF")|string if ptc.filament_color_rgba is defined else "FFFFFFFF" %}
                {% set fexist = ptc.filament_exist[i]|default(False) if ptc.filament_exist is defined else False %}
                {% set ndiam = printer[ext_name].nozzle_diameter|default(0.4)|string if printer[ext_name] is defined else "0.4" %}
                {% set nvol = printer[ext_name].nozzle_volume_type|default("standard")|string if printer[ext_name] is defined else "standard" %}
                {% set cur_sig = (vendor ~ "_" ~ ftype ~ "_" ~ subtype ~ "_" ~ color ~ "_" ~ ndiam ~ "_" ~ nvol)|replace("'", "")|replace('"', "")|replace(" ", "_") %}
                {% set saved_sig = svv["smart_flow_sig_e" ~ i]|default("")|string %}

                {% set ns = namespace(invalid=false) %}
                {% if not fexist or ftype == "NONE" or ftype == "" %}
                    {% set ns.invalid = true %}
                {% elif saved_sig == "" or saved_sig != cur_sig %}
                    {% set ns.invalid = true %}
                {% elif e_sensor.filament_detected is defined and not e_sensor.filament_detected %}
                    {% set ns.invalid = true %}
                {% elif feed_ch.module_exist|default(False) and not feed_ch.disable_auto|default(False) %}
                    {% if not feed_ch.filament_detected|default(False) or feed_ch.channel_state|default("") not in ["load_finish", "inited"] %}
                        {% set ns.invalid = true %}
                    {% endif %}
                {% endif %}

                {% if ns.invalid %}
                    SAVE_VARIABLE VARIABLE={valid_key} VALUE=0
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}

[delayed_gcode _SMART_FLOW_MONITOR]
initial_duration: 5.0
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        _SMART_FLOW_CHECK_LANES
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_SMART_FLOW_MONITOR DURATION=3.0

[gcode_macro _PRINT_START_SMART_FLOW]
description: Verify lane filament state at PRINT_START before auto-feeding and flow calibration
gcode:
    _SMART_FLOW_CHECK_LANES

[gcode_macro SMART_FLOW_RESET]
description: Reset saved smart flow calibration state (EXTRUDER=0..3 or omit for all lanes)
gcode:
    {% if printer.save_variables is defined %}
        {% if params.EXTRUDER is defined %}
            {% set ext = params.EXTRUDER|int %}
            {% if ext >= 0 and ext < 4 %}
                SAVE_VARIABLE VARIABLE=smart_flow_valid_e{ext} VALUE=0
                RESPOND TYPE=echo MSG="Smart Flow Calibration: Reset state for T{ext}"
            {% endif %}
        {% else %}
            {% for i in range(4) %}
                SAVE_VARIABLE VARIABLE=smart_flow_valid_e{i} VALUE=0
            {% endfor %}
            RESPOND TYPE=echo MSG="Smart Flow Calibration: Reset state for all lanes (T0..T3)"
        {% endif %}
    {% endif %}

[gcode_macro SMART_FLOW_MARK_VALID]
description: Mark currently loaded lanes as already flow-calibrated (EXTRUDER=0..3 or omit for all loaded lanes)
gcode:
    {% if printer.save_variables is defined %}
        {% set ptc = printer.print_task_config|default({}) %}
        {% for i in range(4) %}
            {% if params.EXTRUDER is not defined or (params.EXTRUDER|int == i) %}
                {% set ext_name = "extruder" if i == 0 else "extruder" ~ i %}
                {% set fexist = ptc.filament_exist[i]|default(False) if ptc.filament_exist is defined else False %}
                {% set ftype = ptc.filament_type[i]|default("NONE")|string if ptc.filament_type is defined else "NONE" %}
                {% if fexist and ftype != "NONE" and ftype != "" %}
                    {% set vendor = ptc.filament_vendor[i]|default("NONE")|string if ptc.filament_vendor is defined else "NONE" %}
                    {% set subtype = ptc.filament_sub_type[i]|default("NONE")|string if ptc.filament_sub_type is defined else "NONE" %}
                    {% set color = ptc.filament_color_rgba[i]|default("FFFFFFFF")|string if ptc.filament_color_rgba is defined else "FFFFFFFF" %}
                    {% set ndiam = printer[ext_name].nozzle_diameter|default(0.4)|string if printer[ext_name] is defined else "0.4" %}
                    {% set nvol = printer[ext_name].nozzle_volume_type|default("standard")|string if printer[ext_name] is defined else "standard" %}
                    {% set sig = (vendor ~ "_" ~ ftype ~ "_" ~ subtype ~ "_" ~ color ~ "_" ~ ndiam ~ "_" ~ nvol)|replace("'", "")|replace('"', "")|replace(" ", "_") %}
                    SAVE_VARIABLE VARIABLE=smart_flow_valid_e{i} VALUE=1
                    SAVE_VARIABLE VARIABLE=smart_flow_sig_e{i} VALUE="'{sig}'"
                    RESPOND TYPE=echo MSG="Smart Flow Calibration: Marked T{i} ({vendor} {ftype} {subtype}) as calibrated"
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}

[gcode_macro FLOW_RESET_K]
rename_existing: _FLOW_RESET_K_BASE
description: Invalidate smart flow calibration state when filament info or RFID changes
gcode:
    {% if params.EXTRUDER is defined and printer.save_variables is defined %}
        {% set ext = params.EXTRUDER|int %}
        {% if ext >= 0 and ext < 4 %}
            SAVE_VARIABLE VARIABLE=smart_flow_valid_e{ext} VALUE=0
        {% endif %}
    {% endif %}
    _FLOW_RESET_K_BASE {rawparams}

[gcode_macro INNER_FILAMENT_UNLOAD]
description: Unload filament and invalidate smart flow calibration state for active lane
gcode:
    {% if printer.save_variables is defined %}
        {% set active_ext = printer.toolhead.extruder %}
        {% if printer[active_ext] is defined and printer[active_ext].extruder_index is defined %}
            {% set ext = printer[active_ext].extruder_index|int %}
            {% if ext >= 0 and ext < 4 %}
                SAVE_VARIABLE VARIABLE=smart_flow_valid_e{ext} VALUE=0
            {% endif %}
        {% endif %}
    {% endif %}
    {% set nozzle_diameter = params.NOZZLE_DIAMETER | default(0.4) | float %}
    {% set temp = params.TEMP | default(250) | int %}
    {% set soft = params.SOFT | default(0) | int %}

    MOVE_TO_DISCARD_FILAMENT_POSITION
    M109 S{temp}
    CONTROL_RETRACT_ACTION SOFT={soft}
    M400
    M104 S0
    M106 S255
    G4 P5000
    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=2
    INNER_DISCARD_FILAMENT_BASE_DISCARD
    M107

[gcode_macro INNER_FLUSH_FILAMENT]
description: Flush newly loaded filament and invalidate smart flow calibration state for active lane
gcode:
    {% if printer.save_variables is defined %}
        {% set active_ext = printer.toolhead.extruder %}
        {% if printer[active_ext] is defined and printer[active_ext].extruder_index is defined %}
            {% set ext = printer[active_ext].extruder_index|int %}
            {% if ext >= 0 and ext < 4 %}
                SAVE_VARIABLE VARIABLE=smart_flow_valid_e{ext} VALUE=0
            {% endif %}
        {% endif %}
    {% endif %}
    {% set nozzle_diameter = params.NOZZLE_DIAMETER | default(0.4) | float %}
    {% set soft = params.SOFT | default(0) | int %}
    {% set temp = params.TEMP | default(250) | int %}
    {% set speed_default = 360 if soft == 0 else 200 %}
    {% if nozzle_diameter < 0.3 %}
        {% set speed_default = 210 if soft == 0 else 60 %}
    {% endif %}
    {% set speed = params.SPEED | default(speed_default) | int %}
    {% set length = params.LENGTH | default(80.0) | float %}
    {% set retract_length_default = 5.0 if soft == 0 else 2.0 %}
    {% set retract_length = params.RETRACT_LENGTH | default(retract_length_default) | float %}
    {% set e_pos = printer[printer.toolhead.extruder].printing_e_pos | float | abs %}
    {% if printer['print_stats'].state == 'paused' or printer['print_stats'].state == 'printing' %}
        {% set retract_length = e_pos %}
    {% endif %}

    M106 S255
    G4 P5000
    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=1
    INNER_DISCARD_FILAMENT_BASE_DISCARD
    M107
    M400
    M109 S{temp}
    M83
    G1 E{length} F{speed}
    M400
    M104 S0
    M106 S255
    _CLIENT_RETRACT LENGTH={retract_length}
    M400
    G4 P5000
    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=2
    INNER_DISCARD_FILAMENT_BASE_DISCARD
    M107

[gcode_macro INNER_FLOW_CALIB_END_BASE_DISCARD]
description: Finish flow calibration discard and record valid calibration state for active lane
gcode:
    M106 S255
    # M106 P2 S255
    M109 S170
    M107
    # M107 P2
    M104 S0
    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=3
    INNER_DISCARD_FILAMENT_BASE_DISCARD
    {% if printer.save_variables is defined %}
        {% set active_ext = printer.toolhead.extruder %}
        {% if printer[active_ext] is defined and printer[active_ext].extruder_index is defined %}
            {% set ext = printer[active_ext].extruder_index|int %}
            {% if ext >= 0 and ext < 4 %}
                {% set ptc = printer.print_task_config|default({}) %}
                {% set vendor = ptc.filament_vendor[ext]|default("NONE")|string if ptc.filament_vendor is defined else "NONE" %}
                {% set ftype = ptc.filament_type[ext]|default("NONE")|string if ptc.filament_type is defined else "NONE" %}
                {% set subtype = ptc.filament_sub_type[ext]|default("NONE")|string if ptc.filament_sub_type is defined else "NONE" %}
                {% set color = ptc.filament_color_rgba[ext]|default("FFFFFFFF")|string if ptc.filament_color_rgba is defined else "FFFFFFFF" %}
                {% set ndiam = printer[active_ext].nozzle_diameter|default(0.4)|string %}
                {% set nvol = printer[active_ext].nozzle_volume_type|default("standard")|string %}
                {% set sig = (vendor ~ "_" ~ ftype ~ "_" ~ subtype ~ "_" ~ color ~ "_" ~ ndiam ~ "_" ~ nvol)|replace("'", "")|replace('"', "")|replace(" ", "_") %}
                SAVE_VARIABLE VARIABLE=smart_flow_valid_e{ext} VALUE=1
                SAVE_VARIABLE VARIABLE=smart_flow_sig_e{ext} VALUE="'{sig}'"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro SM_PRINT_EXTRUDER_PREHEAT]
description: Preheat used extruder only if it requires auto-feeding or flow calibration
gcode:
    {% set extruder = params.EXTRUDER | default(999) | int %}
    {% set temp = params.TEMP | default(140) | int %}
    {% set max_ext = printer.configfile.settings.printer.max_physical_extruder_num | default(4) | int %}
    {% set ptc = printer.print_task_config | default({}) %}
    {% if extruder >= 0 and extruder < max_ext and ptc.extruders_used is defined and ptc.extruders_used[extruder] %}
        {% set left_feed = printer["filament_feed left"]|default({}) %}
        {% set right_feed = printer["filament_feed right"]|default({}) %}
        {% set feed_obj = left_feed if extruder < 2 else right_feed %}
        {% set feed_ch = feed_obj["extruder" ~ extruder]|default({}) %}
        {% set e_sensor = printer["filament_motion_sensor e" ~ extruder ~ "_filament"]|default({}) %}
        {% set sensor_ok = (e_sensor.filament_detected|default(True) == True) %}
        {% if feed_ch.module_exist|default(False) and not feed_ch.disable_auto|default(False) %}
            {% set is_loaded = (feed_ch.filament_detected|default(False) == True and feed_ch.channel_state|default("") == "load_finish" and sensor_ok) %}
        {% else %}
            {% set is_loaded = sensor_ok %}
        {% endif %}

        {% set ns = namespace(need_preheat=false) %}
        {% if not is_loaded %}
            {% set ns.need_preheat = true %}
        {% elif ptc.flow_calibrate|default(False) and (ptc.flow_calib_extruders[extruder]|default(False) if ptc.flow_calib_extruders is defined else False) %}
            {% set ns.need_preheat = true %}
            {% if printer.save_variables is defined %}
                {% set svv = printer.save_variables.variables %}
                {% set is_valid = svv["smart_flow_valid_e" ~ extruder]|default(0)|int == 1 %}
                {% set saved_sig = svv["smart_flow_sig_e" ~ extruder]|default("")|string %}
                {% set ext_name = "extruder" if extruder == 0 else "extruder" ~ extruder %}
                {% set vendor = ptc.filament_vendor[extruder]|default("NONE")|string if ptc.filament_vendor is defined else "NONE" %}
                {% set ftype = ptc.filament_type[extruder]|default("NONE")|string if ptc.filament_type is defined else "NONE" %}
                {% set subtype = ptc.filament_sub_type[extruder]|default("NONE")|string if ptc.filament_sub_type is defined else "NONE" %}
                {% set color = ptc.filament_color_rgba[extruder]|default("FFFFFFFF")|string if ptc.filament_color_rgba is defined else "FFFFFFFF" %}
                {% set fexist = ptc.filament_exist[extruder]|default(False) if ptc.filament_exist is defined else False %}
                {% set ndiam = printer[ext_name].nozzle_diameter|default(0.4)|string if printer[ext_name] is defined else "0.4" %}
                {% set nvol = printer[ext_name].nozzle_volume_type|default("standard")|string if printer[ext_name] is defined else "standard" %}
                {% set cur_sig = (vendor ~ "_" ~ ftype ~ "_" ~ subtype ~ "_" ~ color ~ "_" ~ ndiam ~ "_" ~ nvol)|replace("'", "")|replace('"', "")|replace(" ", "_") %}
                {% if is_valid and fexist and ftype != "NONE" and ftype != "" and saved_sig != "" and saved_sig == cur_sig %}
                    {% set ns.need_preheat = false %}
                {% endif %}
            {% endif %}
        {% endif %}

        {% if ns.need_preheat %}
            M104 S{temp} T{extruder} A0
        {% endif %}
    {% endif %}

[gcode_macro SM_PRINT_FLOW_CALIBRATE]
rename_existing: _SM_PRINT_FLOW_CALIBRATE_BASE
description: Skip pre-print flow calibration on lanes whose filament has not changed since last calibration
gcode:
    {% set ptc = printer.print_task_config|default({}) %}
    {% set ns = namespace(ext=-1, skip=false) %}
    {% if params.INDEX is defined and params.EXTRUDER is defined %}
        {% set ns.ext = -1 %}
    {% elif params.INDEX is defined %}
        {% set idx = params.INDEX|int %}
        {% if ptc.extruder_map_table is defined and idx >= 0 and idx < (ptc.extruder_map_table|length) %}
            {% set ns.ext = ptc.extruder_map_table[idx]|int %}
        {% endif %}
    {% elif params.EXTRUDER is defined %}
        {% set ns.ext = params.EXTRUDER|int %}
    {% else %}
        {% set active_ext = printer.toolhead.extruder %}
        {% if printer[active_ext] is defined and printer[active_ext].extruder_index is defined %}
            {% set ns.ext = printer[active_ext].extruder_index|int %}
        {% endif %}
    {% endif %}

    {% if ns.ext >= 0 and ns.ext < 4 and ptc.auto_replenish_filament|default(False) and ptc.extruders_replenished is defined %}
        {% set ns.ext = ptc.extruders_replenished[ns.ext]|default(ns.ext)|int %}
    {% endif %}

    {% if ns.ext >= 0 and ns.ext < 4 and printer.save_variables is defined %}
        {% set ext = ns.ext %}
        {% set used = ptc.extruders_used[ext]|default(False) if ptc.extruders_used is defined else False %}
        {% set do_flow = ptc.flow_calibrate|default(False) and (ptc.flow_calib_extruders[ext]|default(False) if ptc.flow_calib_extruders is defined else False) %}
        {% if used and do_flow %}
            {% set svv = printer.save_variables.variables %}
            {% set is_valid = svv["smart_flow_valid_e" ~ ext]|default(0)|int == 1 %}
            {% set saved_sig = svv["smart_flow_sig_e" ~ ext]|default("")|string %}
            {% set ext_name = "extruder" if ext == 0 else "extruder" ~ ext %}
            {% set vendor = ptc.filament_vendor[ext]|default("NONE")|string if ptc.filament_vendor is defined else "NONE" %}
            {% set ftype = ptc.filament_type[ext]|default("NONE")|string if ptc.filament_type is defined else "NONE" %}
            {% set subtype = ptc.filament_sub_type[ext]|default("NONE")|string if ptc.filament_sub_type is defined else "NONE" %}
            {% set color = ptc.filament_color_rgba[ext]|default("FFFFFFFF")|string if ptc.filament_color_rgba is defined else "FFFFFFFF" %}
            {% set fexist = ptc.filament_exist[ext]|default(False) if ptc.filament_exist is defined else False %}
            {% set ndiam = printer[ext_name].nozzle_diameter|default(0.4)|string if printer[ext_name] is defined else "0.4" %}
            {% set nvol = printer[ext_name].nozzle_volume_type|default("standard")|string if printer[ext_name] is defined else "standard" %}
            {% set cur_sig = (vendor ~ "_" ~ ftype ~ "_" ~ subtype ~ "_" ~ color ~ "_" ~ ndiam ~ "_" ~ nvol)|replace("'", "")|replace('"', "")|replace(" ", "_") %}

            {% set left_feed = printer["filament_feed left"]|default({}) %}
            {% set right_feed = printer["filament_feed right"]|default({}) %}
            {% set feed_obj = left_feed if ext < 2 else right_feed %}
            {% set feed_ch = feed_obj["extruder" ~ ext]|default({}) %}
            {% set e_sensor = printer["filament_motion_sensor e" ~ ext ~ "_filament"]|default({}) %}

            {% set sensor_ok = (e_sensor.filament_detected|default(True) == True) %}
            {% if feed_ch.module_exist|default(False) and not feed_ch.disable_auto|default(False) %}
                {% set feed_ok = (feed_ch.filament_detected|default(False) == True and feed_ch.channel_state|default("") == "load_finish") %}
            {% else %}
                {% set feed_ok = True %}
            {% endif %}

            {% if is_valid and fexist and ftype != "NONE" and ftype != "" and saved_sig != "" and saved_sig == cur_sig and sensor_ok and feed_ok %}
                {% set ns.skip = true %}
                FLOW_APPLY_CALIBRATE_K EXTRUDER={ext}
                {% set cur_pa = printer[ext_name].pressure_advance|default(0.0)|float %}
                RESPOND TYPE=echo MSG="Smart Flow Calibration: Skipping T{ext} ({vendor} {ftype} {subtype} unchanged, PA={ "%.6f"|format(cur_pa) })"
            {% endif %}
        {% endif %}
    {% endif %}

    {% if not ns.skip %}
        _SM_PRINT_FLOW_CALIBRATE_BASE {rawparams}
    {% endif %}
