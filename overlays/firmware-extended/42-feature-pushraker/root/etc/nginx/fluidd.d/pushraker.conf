# pushraker's settings page, from the package in the firmware image (linked
# by scripts/01-install-pushraker.sh). It talks to Moonraker through this server's /server/ proxy.
location = /notifications {
    return 302 /notifications/;
}

location /notifications/ {
    alias /usr/local/share/pushraker/web/;
    index index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
