settings:
  snapmaker_components:
    items:
      rfid_hardware:
        label: RFID Hardware
        description: Select the physical RFID reader hardware.
        get_cmd:
          - bash
          - -c
          - |
            val=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg components rfid_hardware 2>/dev/null)
            if [ -z "$val" ]; then
              val=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg components rfid snapmaker 2>/dev/null)
            fi
            echo "${val:-snapmaker}"
        options:
          snapmaker:
            label: Snapmaker
            if_cmd: test ! -f /oem/printer_data/config/extended/klipper/ace.cfg
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg components rfid_hardware snapmaker
                /etc/init.d/S59rfid-support restart
                /etc/init.d/S60klipper restart
          external:
            label: External
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg components rfid_hardware external
                /etc/init.d/S59rfid-support restart
                /etc/init.d/S60klipper restart
        default: snapmaker

      rfid_software:
        label: RFID Software
        description: Select the RFID tag processing software.
        if_cmd: test "$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg components rfid_hardware 2>/dev/null || /usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg components rfid snapmaker 2>/dev/null || echo snapmaker)" != "external"
        get_cmd:
          - bash
          - -c
          - |
            val=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg components rfid_software 2>/dev/null)
            if [ -z "$val" ]; then
              val=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg components rfid snapmaker 2>/dev/null)
            fi
            echo "${val:-snapmaker}"
        options:
          snapmaker:
            label: Snapmaker
            if_cmd: test "$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg components rfid_hardware 2>/dev/null || echo snapmaker)" != "ace" -a ! -f /oem/printer_data/config/extended/klipper/ace.cfg
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg components rfid_software snapmaker
                /etc/init.d/S99openrfid stop
                /etc/init.d/S60klipper restart
        default: snapmaker
