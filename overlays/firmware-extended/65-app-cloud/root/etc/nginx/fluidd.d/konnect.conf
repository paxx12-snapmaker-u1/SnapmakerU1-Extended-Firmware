# konnect onboarding UI, proxied the same way the Mainsail/Fluidd
# installer does it on a Pi: http://<printer>/konnect/
location /konnect/ {
    proxy_pass http://127.0.0.1:7130/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
