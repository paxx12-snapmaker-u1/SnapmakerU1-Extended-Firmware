settings:
  tweaks:
    items:
      parallel_feed_preheat:
        label: Parallel Feed Preheat
        description: Pre-heats targeted toolheads during filament loading and unloading operations in parallel, cutting swap times while staying below melt temperature to prevent oozing.
        get_cmd:
          - bash
          - -c
          - |
            CFG=/oem/printer_data/config/extended/klipper/parallel_feed_preheat.cfg
            [ -f "$CFG" ] || CFG=/home/lava/printer_data/config/extended/klipper/parallel_feed_preheat.cfg
            if [ ! -f "$CFG" ] || grep -qi "variable_parallel_feed_preheat:.*false" "$CFG"; then
              echo "disabled"
            elif grep -qi "variable_parallel_feed_preheat_temp:.*170" "$CFG"; then
              echo "perf_170"
            elif grep -qi "variable_parallel_feed_preheat_temp:.*150" "$CFG"; then
              echo "warm_150"
            elif grep -qi "variable_parallel_feed_preheat_temp:.*130" "$CFG"; then
              echo "safe_130"
            else
              echo "safe_130"
            fi
        options:
          safe_130:
            label: "Safe 130°C (Recommended)"
            confirm: "Enable Parallel Feed Preheat at 130°C? Targeted toolheads will preheat to 130°C in parallel during feed/unload operations."
            cmd:
              - bash
              - -xc
              - |
                for dir in /home/lava/printer_data/config/extended/klipper /oem/printer_data/config/extended/klipper; do
                  mkdir -p "$dir" &&
                  printf "# Parallel Feed Preheat Feature Configuration\n[gcode_macro _EXTENDED_FEATURE_VARIABLES]\nvariable_parallel_feed_preheat: True\nvariable_parallel_feed_preheat_temp: 130\ngcode:\n" > "$dir/parallel_feed_preheat.cfg" &&
                  chown -R lava:lava "$dir/parallel_feed_preheat.cfg" 2>/dev/null || true
                done &&
                echo "Parallel Feed Preheat (130°C) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          warm_150:
            label: "Warm 150°C"
            confirm: "Enable Parallel Feed Preheat at 150°C? Targeted toolheads will preheat to 150°C in parallel during feed/unload operations."
            cmd:
              - bash
              - -xc
              - |
                for dir in /home/lava/printer_data/config/extended/klipper /oem/printer_data/config/extended/klipper; do
                  mkdir -p "$dir" &&
                  printf "# Parallel Feed Preheat Feature Configuration\n[gcode_macro _EXTENDED_FEATURE_VARIABLES]\nvariable_parallel_feed_preheat: True\nvariable_parallel_feed_preheat_temp: 150\ngcode:\n" > "$dir/parallel_feed_preheat.cfg" &&
                  chown -R lava:lava "$dir/parallel_feed_preheat.cfg" 2>/dev/null || true
                done &&
                echo "Parallel Feed Preheat (150°C) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          perf_170:
            label: "Performance 170°C"
            confirm: "Enable Parallel Feed Preheat at 170°C? Targeted toolheads will preheat to 170°C in parallel during feed/unload operations. Warning: 170°C approaches the softening temperature of low-temp filaments (e.g. PLA). Ensure filament is not left parked hot."
            cmd:
              - bash
              - -xc
              - |
                for dir in /home/lava/printer_data/config/extended/klipper /oem/printer_data/config/extended/klipper; do
                  mkdir -p "$dir" &&
                  printf "# Parallel Feed Preheat Feature Configuration\n[gcode_macro _EXTENDED_FEATURE_VARIABLES]\nvariable_parallel_feed_preheat: True\nvariable_parallel_feed_preheat_temp: 170\ngcode:\n" > "$dir/parallel_feed_preheat.cfg" &&
                  chown -R lava:lava "$dir/parallel_feed_preheat.cfg" 2>/dev/null || true
                done &&
                echo "Parallel Feed Preheat (170°C) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Disabled (Stock behavior)"
            cmd:
              - bash
              - -xc
              - |
                for dir in /home/lava/printer_data/config/extended/klipper /oem/printer_data/config/extended/klipper; do
                  mkdir -p "$dir" &&
                  printf "# Parallel Feed Preheat Feature Configuration\n[gcode_macro _EXTENDED_FEATURE_VARIABLES]\nvariable_parallel_feed_preheat: False\nvariable_parallel_feed_preheat_temp: 130\ngcode:\n" > "$dir/parallel_feed_preheat.cfg" &&
                  chown -R lava:lava "$dir/parallel_feed_preheat.cfg" 2>/dev/null || true
                done &&
                echo "Parallel Feed Preheat disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: safe_130
