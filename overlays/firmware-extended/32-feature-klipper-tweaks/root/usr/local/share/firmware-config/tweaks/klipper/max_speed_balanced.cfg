# tier: balanced
# Max Speed (Balanced) - Raised XY Motion and Faster Tool Changes
# Origin: https://github.com/JNP-1/Snapmaker-U1-Config, reduced here. The
# conservative tier; tool change values sit at roughly half the point where tool
# confirmation retries were observed.
#
# WARNING: Only enable on a calibrated printer. Dock positions and belt tension
# must be correct and tool changes already reliable on the stock configuration.
# Raised cornering speed can cause ringing if input shaper is not calibrated.
#
# Docs: http://snapmakeru1-extended-firmware.pages.dev/tweaks#max-speed

[printer]
max_velocity: 600  # stock: 500
max_accel: 22000  # stock: 20000
square_corner_velocity: 10  # stock: 8

# Faster tool changes for all four toolheads

[extruder]
fast_move_speed: 550  # stock: 400
slow_move_speed: 40  # stock: 60, lower on purpose
grab_speed: 30  # stock: 10
switch_accel: 12000  # stock: 5000

