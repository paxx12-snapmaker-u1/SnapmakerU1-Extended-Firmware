# TMC Reduced Current lowers the X/Y motor current to 1.0A. It can be combined
# with Max Speed (Balanced), whose tool-change speeds stay within the margin
# that 1.0A leaves. Max Speed (Aggressive) is refused instead, because its
# tool-change speeds are tuned for 1.2A and are not validated at 1.0A.

settings:
  tweaks:
    items:
      tmc_reduce_current:
        label: TMC Reduced Current
        description: Lowers X/Y motor current from 1.2A to 1.0A for quieter operation and less heat.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#tmc-reduced-current
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/tmc_current.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: Enabled
            confirm: |-
              Enable TMC Reduced Current?
              This lowers X/Y motor current from 1.2A to 1.0A for quieter operation and less heat.
              If Max Speed (Balanced) is enabled, both settings apply together: X/Y current stays at 1.0A while motion limits are raised. Reduced current can skip steps under heavy load or fast movements, so confirm that you accept this combination.
              Monitor motor temperatures and print quality after enabling.
            cmd:
              - bash
              - -xc
              - |
                CFG=/oem/printer_data/config/extended/klipper/10_max_speed.cfg
                if test -f "$CFG" && grep -q '^# tier: aggressive' "$CFG"; then
                  echo "ERROR: Max Speed (Aggressive) is enabled. Its tool-change speeds are tuned for 1.2A and are not validated at 1.0A."
                  echo "Disable Max Speed, or switch to the Balanced tier, before enabling TMC Reduced Current."
                  exit 1
                fi
                if test -f "$CFG"; then
                  echo "Max Speed (Balanced) stays enabled: X/Y current will be 1.0A with raised motion limits."
                fi
                cp -v /usr/local/share/firmware-config/tweaks/klipper/tmc_current.cfg /oem/printer_data/config/extended/klipper/tmc_current.cfg &&
                echo "TMC Reduced Current enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -xc
              - |
                rm -vf /oem/printer_data/config/extended/klipper/tmc_current.cfg &&
                echo "TMC Reduced Current disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
