# tier: aggressive
# Max Speed (Aggressive) - High-Speed XY Motion and Fast Tool Changes
# Origin: https://github.com/JNP-1/Snapmaker-U1-Config; tool change values as
# proposed by @justinh-rahb in #679.
#
# WARNING: Only enable on a fully calibrated printer, and start with the Balanced
# tier. Dock positions and belt tension must be correct and tool changes already
# reliable on the stock configuration. Raised cornering speed can cause ringing if
# input shaper is not calibrated.
#
# Docs: http://snapmakeru1-extended-firmware.pages.dev/tweaks#max-speed

[printer]
max_velocity: 750  # stock: 500
max_accel: 25000  # stock: 20000
square_corner_velocity: 15  # stock: 8

# Faster tool changes for all four toolheads

[extruder]
fast_move_speed: 700  # stock: 400
slow_move_speed: 60  # stock: 60
grab_speed: 50  # stock: 10
switch_accel: 25000  # stock: 5000

[extruder1]
fast_move_speed: 700  # stock: 400
slow_move_speed: 60  # stock: 60
grab_speed: 50  # stock: 10
switch_accel: 25000  # stock: 5000

