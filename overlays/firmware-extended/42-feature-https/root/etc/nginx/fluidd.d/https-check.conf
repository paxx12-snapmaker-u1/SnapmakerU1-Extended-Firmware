# Shows whether the browser's client certificate would pass mTLS. With
# client-ca.pem present but mtls off, nginx asks for a certificate without
# requiring one, so this can be checked before enabling enforcement.
location = /https-check {
    # Before mTLS is required only the test port asks for a certificate
    if ($https_mtls_mode = test) {
        return 302 https://$host:4443/https-check;
    }
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "Printer client certificate check

Connection:           $https_check_connection
Client certificates:  $https_check_mode
Result:               $https_check_result

Subject:              $ssl_client_s_dn
Issuer:               $ssl_client_i_dn
Valid until:          $ssl_client_v_end
Days remaining:       $ssl_client_v_remain
SHA1 fingerprint:     $ssl_client_fingerprint
";
}
