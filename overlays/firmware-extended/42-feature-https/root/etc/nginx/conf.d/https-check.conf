# Wording for the client certificate check page (fluidd.d/https-check.conf)

map $https $https_check_connection {
    on      "HTTPS";
    default "plain HTTP - open https://$host/https-check to test client certificates";
}

# Set by the generated listen.d/00-listen.conf and the port 4443 test server
map $https_mtls_mode $https_check_mode {
    required   "required (mtls: true)";
    check_port "test port: requested but not required (mtls: false)";
    test       "not requested on this port (mtls: false) - test at https://$host:4443/https-check";
    default    "not requested (upload extended/tls/client-ca.pem to test)";
}

map $ssl_client_verify $https_check_result {
    SUCCESS                "OK - this certificate is trusted by client-ca.pem";
    NONE                   "no client certificate was sent by this browser";
    "~^FAILED:(?<why>.*)$" "REJECTED - $why";
    default                "$ssl_client_verify";
}
