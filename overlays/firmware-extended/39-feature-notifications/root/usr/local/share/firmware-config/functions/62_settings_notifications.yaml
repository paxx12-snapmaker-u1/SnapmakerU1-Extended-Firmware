settings:
  monitoring_debugging:
    items:
      notifications:
        label: Push Notifications
        description: Print, progress and error notifications with camera snapshots, via ntfy, Pushover, Telegram, Discord, email or a webhook.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/notifications
        form:
          html: forms/notifications.html
          get_cmd:
            - /usr/local/bin/notifications-config.py
            - get
          commands:
            test:
              label: Send Test
              style: secondary
              cmd:
                - /usr/local/bin/notifications-config.py
                - test
            save:
              label: Save & Apply
              style: primary
              close_on_success: true
              cmd:
                - /usr/local/bin/notifications-config.py
                - save
