settings:
  snapmaker_components:
    items:
      snapace:
        label: SnapAce / Anycubic ACE Pro
        description: Optional Anycubic ACE Pro storage, feed assist, and dryer integration.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/snapace
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/ace.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: Enabled
            confirm: |
              Enable SnapAce support for Anycubic ACE Pro?

              Before enabling, connect the ACE Pro over USB, verify the serial path in ace.cfg, and tune feed_length/retract_length after installation. This is experimental and changes filament loading behavior while enabled.
            cmd:
              - bash
              - -ec
              - |
                mkdir -p /oem/printer_data/config/extended/klipper
                cp -n /usr/local/share/firmware-config/tweaks/klipper/ace.cfg /oem/printer_data/config/extended/klipper/ace.cfg
                chown lava:lava /oem/printer_data/config/extended/klipper/ace.cfg
                echo "SnapAce enabled. Review /oem/printer_data/config/extended/klipper/ace.cfg and tune feed_length/retract_length. Restarting Klipper..."
                /etc/init.d/S60klipper restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -ec
              - |
                rm -f /oem/printer_data/config/extended/klipper/ace.cfg
                echo "SnapAce disabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
        default: disabled
