# BIQU PopStation mini - Longer Filament Preload
# The PopStation mini moves the feeders below the printer, so filament has to
# travel further to reach the toolhead. Values from the BIQU setup guide:
# https://neo.bttwiki.com/en/docs/more-series/pop-module/popstation-mini/
#
# Requires the 39-feature-popstation patch that raises the preload_length cap
# in filament_feed.py from 1500 to 2500.
#
# Docs: http://snapmakeru1-extended-firmware.pages.dev/popstation

[filament_feed left]
preload_length: 2000  # stock: 950

[filament_feed right]
preload_length: 2000  # stock: 950
