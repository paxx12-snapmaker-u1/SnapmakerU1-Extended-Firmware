settings:
  snapmaker_components:
    items:
      popstation:
        label: BIQU PopStation mini
        description: Raises the filament preload length from 950 mm to 2000 mm on both feeders so filament reaches the toolhead through the PopStation mini's longer path.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/popstation
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/popstation.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: Enabled
            confirm: "Enable BIQU PopStation mini support? This sets the preload length to 2000 mm on both feeders. Only enable this if your feeders are installed in a PopStation mini. On a stock setup, filament may be pushed hard into the toolhead."
            cmd:
              - bash
              - -xc
              - |
                cp -v /usr/local/share/firmware-config/tweaks/klipper/popstation.cfg /oem/printer_data/config/extended/klipper/popstation.cfg &&
                echo "BIQU PopStation mini enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -xc
              - |
                rm -vf /oem/printer_data/config/extended/klipper/popstation.cfg &&
                echo "BIQU PopStation mini disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
