settings:
  snapmaker_components:
    items:
      spoolman:
        label: Spoolman Integration
        description: Track filament usage and metadata with Spoolman spool management.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/spoolman
        get_cmd:
          - bash
          - -c
          - |
            HOST=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg spoolman host "" 2>/dev/null)
            FORCE_GENERIC=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg spoolman force_generic_vendor false 2>/dev/null)

            if [ -z "$HOST" ]; then
              echo "disabled"
            elif [ "$FORCE_GENERIC" = "true" ]; then
              echo "force_generic"
            else
              echo "enabled"
            fi
        options:
          enabled:
            label: Enabled
            confirm: "Enable Spoolman integration? Enter the Spoolman server URL below.\n\nSpoolman tracks filament usage and lets you manage spool metadata from your web frontend."
            inputs:
              - name: SPOOLMAN_URL
                label: Spoolman URL
                placeholder: "http://192.168.1.100:7912"
                regex: "^https?://.+"
            cmd:
              - bash
              - -c
              - |
                URL="${SPOOLMAN_URL%/}"
                if ! curl -fsS --max-time 10 "${URL}/api/v1/info" | grep -q '"version"'; then
                  echo "ERROR: Spoolman validation failed (could not reach ${URL})."
                  exit 1
                fi
                /usr/local/bin/extended-config.py uncomment /oem/printer_data/config/extended/extended2.cfg spoolman
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg spoolman host "${URL}" || {
                  echo "ERROR: Failed to set Spoolman host."
                  exit 1
                }
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg spoolman force_generic_vendor false || {
                  echo "ERROR: Failed to disable Force Generic Vendor."
                  exit 1
                }
                echo "Spoolman enabled. Restarting Klipper and Moonraker to start SpoolLink..."
                /etc/init.d/S60klipper restart
                /etc/init.d/S61moonraker restart
          force_generic:
            label: Enabled (Force Generic Vendor)
            confirm: "Enable Spoolman integration with Force Generic Vendor? Enter the Spoolman server URL below.\n\nNon-Snapmaker filament vendors will be exposed to the U1 as Generic while Spoolman metadata and tracking remain unchanged."
            inputs:
              - name: SPOOLMAN_URL
                label: Spoolman URL
                placeholder: "http://192.168.1.100:7912"
                regex: "^https?://.+"
            cmd:
              - bash
              - -c
              - |
                URL="${SPOOLMAN_URL%/}"
                if ! curl -fsS --max-time 10 "${URL}/api/v1/info" | grep -q '"version"'; then
                  echo "ERROR: Spoolman validation failed (could not reach ${URL})."
                  exit 1
                fi
                /usr/local/bin/extended-config.py uncomment /oem/printer_data/config/extended/extended2.cfg spoolman
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg spoolman host "${URL}" || {
                  echo "ERROR: Failed to set Spoolman host."
                  exit 1
                }
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg spoolman force_generic_vendor true || {
                  echo "ERROR: Failed to enable Force Generic Vendor."
                  exit 1
                }
                echo "Spoolman enabled with Force Generic Vendor. Restarting Klipper and Moonraker to start SpoolLink..."
                /etc/init.d/S60klipper restart
                /etc/init.d/S61moonraker restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py comment /oem/printer_data/config/extended/extended2.cfg spoolman
                echo "SpoolLink disabled. Restarting Klipper and Moonraker..."
                /etc/init.d/S60klipper restart
                /etc/init.d/S61moonraker restart
        default: disabled
      spoolman_tag_store:
        label: Spoolman Tag Storage
        description: Where SpoolLink links RFID cards to spools. Switching moves every existing link to the new store.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/spoolman#card-uid-storage
        # Hidden until the apps that read only card_uids support native tags.
        hidden: true
        if_cmd: test -n "$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg spoolman host '' 2>/dev/null)"
        get_cmd:
          - bash
          - -c
          - /usr/local/bin/extended-config.py get /oem/printer_data/config/extended/extended2.cfg spoolman tag_store card_uids 2>/dev/null
        options:
          card_uids:
            label: Card UIDs
            confirm: "Store card links in the card_uids spool field?\n\nWorks with every Spoolman version and every SpoolLink app. Links stored as Spoolman native tags are moved into card_uids and unlinked from Spoolman's Tags. Moonraker restarts."
            cmd:
              - bash
              - -c
              - |
                STORE=card_uids
                CFG=/oem/printer_data/config/extended/extended2.cfg
                HOST=$(/usr/local/bin/extended-config.py get "$CFG" spoolman host "" 2>/dev/null)
                if [ -z "$HOST" ]; then
                  echo "ERROR: Enable Spoolman Integration first."
                  exit 1
                fi
                # Stop Moonraker so SpoolLink writes no links while they move.
                /etc/init.d/S61moonraker stop
                if /usr/local/bin/spoollink_migrate.py --host "$HOST" "$STORE"; then
                  /usr/local/bin/extended-config.py add "$CFG" spoolman tag_store "$STORE"
                  RC=$?
                else
                  RC=1
                  echo "ERROR: Migration failed; the tag storage setting is unchanged."
                fi
                echo "Starting Moonraker..."
                /etc/init.d/S61moonraker start
                exit $RC
          native:
            label: Spoolman native tags
            confirm: "Store card links as Spoolman native NFC/RFID tags?\n\nNeeds Spoolman v0.27.0 or newer. Every card_uids link is moved to a native tag and cleared from card_uids, so apps that only read card_uids stop finding those spools: check the apps table in the Spoolman docs first. Moonraker restarts."
            cmd:
              - bash
              - -c
              - |
                STORE=native
                CFG=/oem/printer_data/config/extended/extended2.cfg
                HOST=$(/usr/local/bin/extended-config.py get "$CFG" spoolman host "" 2>/dev/null)
                if [ -z "$HOST" ]; then
                  echo "ERROR: Enable Spoolman Integration first."
                  exit 1
                fi
                # Stop Moonraker so SpoolLink writes no links while they move.
                /etc/init.d/S61moonraker stop
                if /usr/local/bin/spoollink_migrate.py --host "$HOST" "$STORE"; then
                  /usr/local/bin/extended-config.py add "$CFG" spoolman tag_store "$STORE"
                  RC=$?
                else
                  RC=1
                  echo "ERROR: Migration failed; the tag storage setting is unchanged."
                fi
                echo "Starting Moonraker..."
                /etc/init.d/S61moonraker start
                exit $RC
        default: card_uids
