# Push notifications (pushraker). Set up on the Push Notifications page
# (Firmware Config > Links); its settings are in pushraker.conf.
[pushraker]
name: U1
error_index_url: https://wiki.snapmaker.com/en/snapmaker_u1/troubleshooting/u1_error_codes
# Settings from before pushraker (this firmware's earlier Push
# Notifications form), moved over the first time
import_settings: /home/lava/printer_data/config/extended/extended2.cfg notifications
import_secrets: /home/lava/printer_data/moonraker.secrets notifications
# What that form generated, and what the test builds that installed
# pushraker on demand wrote; renamed to .old so they don't load as well
retire_files: /home/lava/printer_data/config/extended/moonraker/notifications.cfg,
  /home/lava/printer_data/config/extended/klipper/notifications.cfg,
  /home/lava/printer_data/config/extended/moonraker/pushraker.cfg,
  /home/lava/printer_data/config/extended/klipper/pushraker.cfg
