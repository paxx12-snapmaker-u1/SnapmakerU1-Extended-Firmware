links:
  push-notifications:
    url: /notifications/
    icon: "🔔"
    label: Push Notifications
    condition:
      setting: notifications
      value: "true"

settings:
  monitoring_debugging:
    items:
      notifications:
        label: Push Notifications
        description: "Install pushraker integration: print, progress and error notifications with camera snapshots, via ntfy, Gotify, Pushover, Telegram, Discord, email or a webhook. Once enabled, set it up from the Push Notifications link in the Links list."
        help_url: http://snapmakeru1-extended-firmware.pages.dev/notifications
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - pushraker
          - enabled
          - "false"
        options:
          "false":
            label: Disabled
            cmd:
              - /usr/local/bin/pushraker-pkg
              - disable
          "true":
            label: Enabled
            cmd:
              - /usr/local/bin/pushraker-pkg
              - enable
        default: "false"
