[save_variables]
filename: /home/lava/printer_data/config/ace_vars.cfg

[ace]
# Supported values:
#   auto      - detect Anycubic ACE Pro or ACE 2 Pro from /dev/serial/by-id
#   ace_pro   - force Anycubic ACE Pro, JSON serial protocol, 115200 baud
#   ace_2_pro - force Anycubic ACE 2 Pro, protobuf serial protocol, 230400 baud
device_model: auto

# Optional manual override. Leave this at the ACE Pro default when using
# device_model: auto; ACE 2 Pro auto-detection will replace it with the
# detected usb-1a86_USB_Single_Serial_* path when present.
serial: /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
baud: 115200

# Supported values:
#   ace       - Anycubic ACE handles feed assist while printing
#   snapmaker - Snapmaker U1 feeders handle the assist path
#   off       - no feed assist
assist_source: snapmaker

# Compatibility fields kept in sync with assist_source by Firmware Config.
# ace       -> enable_feed_assist: True,  enable_feeder_mode: False
# snapmaker -> enable_feed_assist: False, enable_feeder_mode: True
# off       -> enable_feed_assist: False, enable_feeder_mode: False
enable_feed_assist: False
enable_feeder_mode: True

# RFID source for ACE slot metadata. Managed by the RFID Software setting.
#   existing - use U1/OpenRFID metadata (set by RFID Software = Snapmaker/OpenRFID)
#   ace      - use ACE slot RFID metadata (set by RFID Software = ACE)
#   none     - ignore ACE RFID metadata (manual only)
rfid_source: existing

# Force Generic vendor when rfid_source is ace. Manual tuning only.
force_generic: False

# Default speeds in mm/s.
feed_speed: 70
load_speed: 100
retract_speed: 100

# ACE 2 Pro feed-check window sent during initialization.
feed_check_len: 254
feed_check_error_len: 254

# Distances are slot-specific so ACE Pro and ACE 2 Pro can use the same config.
# feed_length is the distance from ACE to the U1 feeder path.
feed_length_slot1: 1000 # TUNE ME
feed_length_slot2: 1000 # TUNE ME
feed_length_slot3: 1000 # TUNE ME
feed_length_slot4: 1000 # TUNE ME

# load_length is the distance from the U1 feeder path to the extruder.
load_length_slot1: 850 # TUNE ME
load_length_slot2: 850 # TUNE ME
load_length_slot3: 850 # TUNE ME
load_length_slot4: 850 # TUNE ME

# retract_length is how far ACE retracts filament back toward the spool.
retract_length_slot1: 3000 # TUNE ME
retract_length_slot2: 3000 # TUNE ME
retract_length_slot3: 3000 # TUNE ME
retract_length_slot4: 3000 # TUNE ME

# Maximum allowed dryer temperature.
max_dryer_temperature: 55

[gcode_macro ACE_DRYING_ON]
gcode:
  ACE_START_DRYING TEMP=55 DURATION=240

[gcode_macro ACE_DRYING_OFF]
gcode:
  ACE_STOP_DRYING
