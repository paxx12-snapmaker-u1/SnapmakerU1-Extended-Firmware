[save_variables]
filename: /home/lava/printer_data/config/ace_vars.cfg

[ace]
# ACE model, serial path, protocol, and baud are detected from /dev/serial/by-id.

# RFID source for ACE slot metadata. Managed by the RFID Software setting.
#   existing - use U1/OpenRFID metadata (set by RFID Software = Snapmaker/OpenRFID)
#   ace      - use ACE slot RFID metadata (set by RFID Software = ACE)
#   none     - ignore ACE RFID metadata (manual only)
rfid_source: existing

# Force Generic vendor when rfid_source is ace. Manual tuning only.
force_generic: False

# Default ACE load speed in mm/s.
load_speed: 100

# ACE 2 Pro feed-check window sent during initialization.
feed_check_len: 254
feed_check_error_len: 254

# load_length is the distance from the U1 feeder path to the extruder.
load_length_slot1: 850 # TUNE ME
load_length_slot2: 850 # TUNE ME
load_length_slot3: 850 # TUNE ME
load_length_slot4: 850 # TUNE ME

# Maximum allowed dryer temperature.
max_dryer_temperature: 55

[gcode_macro ACE_STATUS]
gcode:
  ACE_GET_STATUS

[gcode_macro ACE_REFRESH_CONNECTION]
gcode:
  ACE_REFRESH

[gcode_macro ACE_TEMP]
gcode:
  ACE_GET_TEMP

[gcode_macro ACE_DRYING_ON]
gcode:
  ACE_START_DRYING TEMP=55 DURATION=240

[gcode_macro ACE_DRYING_OFF]
gcode:
  ACE_STOP_DRYING
